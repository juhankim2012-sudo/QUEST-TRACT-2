<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 그려서 올리는 사이트</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div id="sky" aria-hidden="true">
  <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i><i class="cloud c4"></i>
  <i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i><i class="bubble b4"></i><i class="bubble b5"></i><i class="bubble b6"></i><i class="bubble b7"></i><i class="bubble b8"></i>
</div>
<header>
  <h1><a href="#/">그림 그려서 올리는 사이트</a></h1>
  <nav>
    <button id="go-draw" type="button" class="primary">그리기</button>
    <div id="login-slot">로그인 자리</div>
  </nav>
</header>

<main>
<div id="stage">
  <!-- 화면 1: 갤러리 -->
  <section class="view" id="view-gallery">
    <h2>갤러리</h2>
    <p class="note">지금은 이 기기의 브라우저에만 저장돼요. 다른 사람과는 아직 나눌 수 없어요.</p>
    <p id="toast" role="status"></p>
    <div id="grid" class="grid"></div>
  </section>

  <!-- 화면 2: 그리기 -->
  <section class="view" id="view-draw" hidden>
    <p><a href="#/" class="back">← 갤러리로</a></p>
    <h2>그림 그리기</h2>
    <canvas id="canvas" width="480" height="360" aria-label="그림판"></canvas>
    <div class="tools">
      <label>색 <input type="color" id="color" value="#222222"></label>
      <label>굵기 <input type="range" id="size" min="1" max="30" value="5"></label>
    </div>
    <div class="tools">
      <button id="pen" type="button" aria-pressed="true">연필</button>
      <button id="eraser" type="button" aria-pressed="false">지우개</button>
      <button id="undo" type="button">되돌리기</button>
      <button id="clear" type="button">전부 지우기</button>
    </div>
    <div class="tools">
      <input id="name" placeholder="내 이름" maxlength="20" autocomplete="nickname">
      <input id="title" placeholder="그림 제목" maxlength="30">
      <button id="post" type="button" class="primary">올리기</button>
    </div>
    <p id="msg" role="status"></p>
  </section>

  <!-- 화면 3: 한 사람의 공간 (이름을 누르면 열림) -->
  <section class="view" id="view-profile" hidden>
    <p><a href="#/" class="back">← 갤러리로</a></p>
    <div id="profile-head"></div>
    <div id="profile-grid" class="grid"></div>
  </section>
</div>
</main>

<!-- 그림 하나를 크게 보고 댓글 쓰는 창 -->
<dialog id="detail"></dialog>

<script src="storage.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
