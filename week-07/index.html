<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림 나눔터</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>그림 나눔터</h1>
  <!-- 로그인 단추 자리: 아직 만들지 않음 -->
  <div id="login-slot"></div>
</header>

<main>
  <section id="draw">
    <h2>그림 그리기</h2>
    <canvas id="canvas" width="480" height="360"></canvas>
    <div class="tools">
      <label>색 <input type="color" id="color" value="#222222"></label>
      <label>굵기 <input type="range" id="size" min="1" max="30" value="5"></label>
      <button id="clear" type="button">지우기</button>
    </div>
    <div class="tools">
      <input id="title" placeholder="그림 제목" maxlength="30">
      <button id="post" type="button">갤러리에 올리기</button>
    </div>
    <p id="msg" role="status"></p>
  </section>

  <section id="gallery">
    <h2>갤러리</h2>
    <p class="note">지금은 이 기기의 브라우저에만 저장돼요. 다른 사람과는 아직 나눌 수 없어요.</p>
    <div id="list"></div>
  </section>
</main>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
