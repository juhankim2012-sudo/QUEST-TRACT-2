<meta charset="utf-8">
<title>저승길 퇴마록</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#ddd;user-select:none}
  #wrap{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:center}
  canvas{display:block;cursor:crosshair}
  #after{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(#0a1a1fdd,#05100fee);border-top:1px solid #4fd1c566;padding:10px 16px;box-sizing:border-box;font-size:14px}
  #after.hide{display:none}
  #after .top{display:flex;align-items:center;gap:12px}
  #after h2{margin:0;font-size:17px;color:#9ef0e4;font-weight:600}
  #aPts{flex:1;text-align:right}
  .c-soul{color:#ffa94d}.c-tear{color:#74c0fc}.c-grudge{color:#d0a2ff}
  #after button{font:inherit;background:#123033;color:#cfeee9;border:1px solid #4fd1c588;border-radius:6px;padding:4px 10px;cursor:pointer}
  #after button:hover:not(:disabled){background:#1b4a4e}
  #after button:disabled{opacity:.35;cursor:default}
  #after button.on{background:#2a6b66;color:#fff}
  #line{font-style:italic;color:#bfe;margin:4px 0 8px;min-height:20px}
  #list{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:170px;overflow:auto}
  .item{background:#0d2427;border:1px solid #2b5a5a;border-radius:8px;padding:6px 8px}
  .item b{color:#e6fffb}.item small{color:#8bb;display:block;margin:2px 0 4px}
  .item .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="after" class="hide">
    <div class="top"><h2 id="npcName">저승사자</h2><div id="aPts"></div><button id="back">대화 끝내기 (F / Esc)</button></div>
    <div id="line"></div>
    <div id="list"></div>
  </div>
</div>
<script>
// ===== 기본 설정 =====
const W = 960, H = 540, ROAD_TOP = 250, ROAD_BOT = 520;
const SAVE_GAP = 2400, SAVE_W = 320;          // 세이브 포인트 간격과 폭
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dk = document.createElement('canvas'); dk.width = W; dk.height = H;
const dctx = dk.getContext('2d');
const wrap = document.getElementById('wrap');
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); wrap.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const FONT = '"Malgun Gothic","Apple SD Gothic Neo",sans-serif';

// ===== 포인트 =====
const PT_NAMES = { soul: '혼불', tear: '망자의 눈물', grudge: '원념 조각' };
const PT_COLORS = { soul: '#ffa94d', tear: '#74c0fc', grudge: '#d0a2ff' };

// ===== 무기 (저승사자에게 삼) =====
const WEAPONS = {
  dagger:   { name: '은장도',   type: 'melee', dmg: 10, range: 72,  arc: 1.9, cd: 0.28, cost: 2, kb: 70,  price: null, desc: '가볍고 빠른 근접 무기' },
  talisman: { name: '퇴마 부적', type: 'shot',  dmg: 9,  speed: 560, cd: 0.32, cost: 3, pierce: 1, price: { soul: 40 }, desc: '마우스 쪽으로 부적을 던짐 (2마리 관통)' },
  vajra:    { name: '금강저',   type: 'melee', dmg: 24, range: 115, arc: 2.8, cd: 0.65, cost: 7, kb: 190, price: { soul: 110, grudge: 1 }, desc: '넓고 강하게 휘두름' },
  bell:     { name: '신령 방울', type: 'ring',  dmg: 14, range: 135, cd: 0.85, cost: 8, kb: 130, price: { soul: 150, tear: 4 }, desc: '내 주변 전체에 퇴마의 울림' },
};
const W_ORDER = ['dagger', 'talisman', 'vajra', 'bell'];

// ===== 스킬 (사서에게 배움) =====
const SKILLS = {
  light:   { name: '정화의 빛',   cd: 6,  cost: 20, price: { tear: 5 }, desc: '마우스 쪽으로 긴 빛줄기' },
  barrier: { name: '결계',       cd: 12, cost: 25, price: { tear: 8 }, desc: '3초 동안 피해를 막고 몬스터를 밀어냄' },
  scream:  { name: '원한의 비명', cd: 10, cost: 30, price: { tear: 6 }, need: 'hair', desc: '주변 몬스터에게 피해 + 느려짐 (원귀의 기술)' },
  charge:  { name: '망령 돌진',   cd: 7,  cost: 20, price: { tear: 6 }, need: 'helm', desc: '마우스 쪽으로 돌진하며 벰 (해골 기사의 기술)' },
};
const UNIQUES = { hair: { name: '원귀의 머리카락', from: '원귀' }, helm: { name: '해골 기사의 투구', from: '해골 기사' } };

// ===== 몬스터 =====
const MON = {
  zombie:   { name: '좀비',       hp: 30,  speed: 42, dmg: 9,  r: 18, ghost: false, drop: { soul: 2 } },
  skeleton: { name: '해골 병사',   hp: 24,  speed: 72, dmg: 7,  r: 16, ghost: false, drop: { soul: 3 } },
  wisp:     { name: '떠도는 혼령', hp: 20,  speed: 62, dmg: 7,  r: 16, ghost: true,  drop: { soul: 3 }, extra: [['tear', 0.35, 1]] },
  shade:    { name: '그림자 귀신', hp: 38,  speed: 90, dmg: 12, r: 18, ghost: true,  drop: { soul: 6, tear: 1 }, extra: [['grudge', 0.15, 1]] },
  wongwi:   { name: '원귀',       hp: 300, speed: 58, dmg: 16, r: 24, ghost: true,  elite: true, drop: { soul: 40, tear: 6, grudge: 4 }, unique: 'hair' },
  knight:   { name: '해골 기사',   hp: 380, speed: 50, dmg: 20, r: 26, ghost: false, elite: true, drop: { soul: 50, tear: 4, grudge: 5 }, unique: 'helm' },
  // 핼로윈 몬스터
  scarecrow: { name: '호박 허수아비', hp: 45, speed: 50, dmg: 12, r: 20, ghost: false, drop: { soul: 4 }, extra: [['grudge', 0.1, 1]] },
  bat:       { name: '흡혈 박쥐',     hp: 12, speed: 120, dmg: 5, r: 12, ghost: false, drop: { soul: 1 } },
  witch:     { name: '마녀',         hp: 34, speed: 70, dmg: 10, r: 16, ghost: false, drop: { soul: 4 }, extra: [['tear', 0.4, 1]] },
};
// 몬스터 속성: 싸우는 방법이 달라진다
//   ghost 귀신   : 영력이 부족하면 피해 20%
//   body  육체   : 영력과 상관없이 맞음
//   fly   나는 적 : 공중에 떠 있어서 근접 무기(은장도·금강저) 피해 70%
//   armed 무기   : 공격 범위가 넓음. 대신 공격 뒤 숨 고를 때 맞으면 피해 1.5배 (빈틈)
//   armor 갑옷   : 은장도·부적 피해 50%
//   ranged 원거리: 멀리서 공격하고, 가까이 가면 물러남
//   swarm 무리   : 여러 마리가 함께 나옴
const TAGS = {
  ghost: { name: '귀신', color: '#b197fc' }, body: { name: '육체', color: '#c9b48a' }, fly: { name: '나는 적', color: '#74c0fc' },
  armed: { name: '무기', color: '#ffa94d' }, armor: { name: '갑옷', color: '#ced4da' }, ranged: { name: '원거리', color: '#69db7c' }, swarm: { name: '무리', color: '#ff8787' },
};
MON.zombie.tags = ['body'];
MON.skeleton.tags = ['body', 'armed'];
MON.wisp.tags = ['ghost', 'fly'];
MON.shade.tags = ['ghost'];
MON.wongwi.tags = ['ghost'];
MON.knight.tags = ['body', 'armed', 'armor'];
MON.scarecrow.tags = ['body', 'armed'];
MON.bat.tags = ['body', 'fly', 'swarm'];
MON.witch.tags = ['body', 'fly', 'ranged'];
const hasTag = (m, t) => (MON[m.type].tags || []).includes(t);
// 공격 동작: trigger 이 거리 안에 들어오면 준비 시작, reach 맞는 거리, wind 준비 시간, hit 공격 시간, rec 숨 고르기, cd 다음 공격까지
MON.zombie.atk   = { kind: 'swipe', trigger: 46,  reach: 60,  wind: 0.55, hit: 0.15, rec: 0.45, cd: 0.9 };
MON.skeleton.atk = { kind: 'stab',  trigger: 52,  reach: 68,  wind: 0.35, hit: 0.12, rec: 0.35, cd: 0.8, lunge: 16 };
MON.wisp.atk     = { kind: 'lunge', trigger: 120, wind: 0.5,  hit: 0.3,  rec: 0.5,  cd: 1.2, lungeSpd: 420 };
MON.shade.atk    = { kind: 'swipe', trigger: 76,  reach: 90,  wind: 0.4,  hit: 0.15, rec: 0.4,  cd: 0.9 };
MON.wongwi.atk   = { kind: 'swipe', trigger: 72,  reach: 88,  wind: 0.6,  hit: 0.18, rec: 0.5,  cd: 1.0 };
MON.knight.atk   = { kind: 'swipe', trigger: 82,  reach: 104, wind: 0.6,  hit: 0.2,  rec: 0.6,  cd: 1.0 };
MON.scarecrow.atk = { kind: 'swipe', trigger: 74, reach: 104, wind: 0.6,  hit: 0.18, rec: 0.55, cd: 0.9 };    // 큰 낫
MON.bat.atk       = { kind: 'lunge', trigger: 150, wind: 0.35, hit: 0.28, rec: 0.6,  cd: 1.0, lungeSpd: 480 };
MON.witch.atk     = { kind: 'shoot', trigger: 440, wind: 0.8,  hit: 0.1,  rec: 0.6,  cd: 1.7 };            // 저주 불덩이
const ELITE_ORDER = ['wongwi', 'knight'];

// ===== 게임 상태 =====
let state = 'title';
let time = 0;
const cam = { x: 0 };
let P, pts, owned, weapon, wlv, learned, slots, skillCd, uniques, up;
let mons, shots, effects, parts, texts, msgs;
let spawnT, nextElite, eliteIdx, lastSave, hurtFlash, beat;
let drops, natT;   // 바닥에 떨어진 포인트, 저절로 생기는 포인트 타이머
// 구간(등불과 다음 등불 사이)마다 나오는 몬스터 수는 정해져 있다. 뒤 구간일수록 많다 (강한 몬스터는 따로)
let segSpawned;
const segOf = x => Math.floor(x / SAVE_GAP);
const segQuota = s => 12 + 6 * s;   // 1구간 12, 2구간 18, 3구간 24 … (예전 15 + 8 × 구간 에서 약 20% 줄임)
const segLeft = s => Math.max(0, segQuota(s) - (segSpawned[s] || 0));

function newGame() {
  P = { x: 140, y: 390, hp: 100, maxHp: 100, sp: 100, maxSp: 100, spRegen: 5, speed: 210,   // spRegen: 평소 1초에 차는 영력 (세이브 포인트 안에서는 3배)
        inv: 0, slow: 0, shield: 0, dash: null, kx: 0, ky: 0, walk: 0, moving: false,
        vx: 0, vy: 0, amp: 0, drawA: 0 };   // vx,vy 지금 속도 · amp 걷는 동작 크기(0~1) · drawA 그림에서 보는 방향(천천히 돌아감)
  pts = { soul: 0, tear: 0, grudge: 0 };
  owned = { dagger: true }; weapon = 'dagger';
  wlv = { dagger: 0, talisman: 0, vajra: 0, bell: 0 };
  learned = {}; slots = [null, null]; skillCd = {}; uniques = {}; up = { hp: 0, sp: 0 };
  mons = []; shots = []; effects = []; parts = []; texts = []; msgs = [];
  spawnT = 1.5; nextElite = 4200; eliteIdx = 0; lastSave = 0; hurtFlash = 0; beat = 0;
  segSpawned = {};
  drops = []; natT = 4;
  resetBoss();
  cam.x = 0;
}
newGame();

// ===== 부드러운 움직임 도우미 =====
const ease = (rate, dt) => 1 - Math.exp(-dt * rate);   // 목표값으로 다가가는 비율 (rate 가 클수록 빠름)
const lerp = (a, b, t) => a + (b - a) * t;
// 걷는 동작: 빠르게 걸을수록 발이 크게 움직이고, 멈추면 발이 서서히 제자리로 돌아온다
function stepWalk(speedRatio, dt) {
  const r = clamp(speedRatio, 0, 1.2);
  P.amp += (Math.min(1, r * 1.3) - P.amp) * ease(10, dt);
  P.walk += dt * (0.35 + 0.65 * Math.min(1, r));
}

// ===== 입력 =====
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  onKey(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * W;
  mouse.y = (e.clientY - r.top) / r.height * H;
}
cv.addEventListener('mousemove', toCanvas);
cv.addEventListener('mousedown', e => {
  toCanvas(e); initAudio();
  if (devMenu) { devClick(); return; }
  if (menu) { menuClick(); return; }   // 설정 창이 열려 있으면 창 안의 버튼만
  if (state === 'mini') { miniClick(); return; }
  if (state === 'title') { newGame(); state = 'howto'; return; }   // 시작하기 전에 게임 설명 창
  if (state === 'howto') { beginPlay(); return; }
  if (state === 'dead') { deadClick(); return; }
  if (state === 'ending') {
    if (endingChoicesShown()) ENDING_BTNS.forEach((b, i) => { if (mouse.x > b.x && mouse.x < b.x + b.w && mouse.y > b.y && mouse.y < b.y + b.h) endingChoose(i); });
    return;
  }
  if (state !== 'play') return;
  if (e.button === 0 && onGear()) { openMenu(); return; }
  if (e.button === 0) mouse.down = true;
  if (e.button === 2) castSlot(0);
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

// 제작자 코드: 숫자 8자리를 치면 보스 바로 앞으로 가고 모든 강화가 다 찬다
// (공개 저장소라서 코드 숫자 대신 숫자로 만든 지문(해시)만 적어 둠)
const DEV_HASH = 400226464;
let devKeys = '';
const fnv = s => { let h = 0x811c9dc5; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h; };
// 코드를 치면 고르기 창이 열린다 (1 포인트만 충전 · 2 보스 바로 전으로 · 3 보스를 잡은 뒤로)
let devMenu = false;
const DEV_CHOICES = [
  { name: '포인트만 충전', help: '혼불 · 망자의 눈물 · 원념 조각 9999. 자리와 강화는 그대로', fn: () => devPoints() },
  { name: '보스 바로 전으로', help: '5번째 등불로 이동 + 무기 · 스킬 · 강화 전부', fn: () => devWarp() },
  { name: '보스를 잡은 뒤로', help: '무명귀를 잡은 것으로 하고 남문 너머(엔드리스 시작)로 + 강화 전부 + 미니게임 전부 열림', fn: () => devAfterBoss() },
];
function openDevMenu() { if (state === 'ending' || state === 'dead') return; devMenu = true; mouse.down = false; sfx(880, 0.3, 'sine', 0.08, 1320); }
function devChoose(i) { devMenu = false; DEV_CHOICES[i].fn(); sfx(880, 0.5, 'sine', 0.1, 1760); }
function devKey(code) {
  if (code === 'Escape') { devMenu = false; return; }
  const n = ['Digit1', 'Digit2', 'Digit3'].indexOf(code), n2 = ['Numpad1', 'Numpad2', 'Numpad3'].indexOf(code);
  if (n >= 0 || n2 >= 0) devChoose(Math.max(n, n2));
}
const devBtn = i => ({ x: W / 2 - 300, y: 170 + i * 92, w: 600, h: 76 });
function devClick() { DEV_CHOICES.forEach((c, i) => { const b = devBtn(i); if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) devChoose(i); }); }
function drawDevMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(14,12,6,0.97)'; ctx.fillRect(W / 2 - 340, 90, 680, 400);
  ctx.strokeStyle = 'rgba(255,212,59,0.6)'; ctx.lineWidth = 1.5; ctx.strokeRect(W / 2 - 339.5, 90.5, 680, 400);
  ctx.textAlign = 'center'; ctx.font = `bold 22px ${FONT}`; ctx.fillStyle = '#ffd43b'; ctx.fillText('🔑 제작자 코드', W / 2, 132);
  ctx.font = `12px ${FONT}`; ctx.fillStyle = '#b8a878'; ctx.fillText('게임이 멈춰 있어요 · 1 · 2 · 3 또는 클릭 · Esc 닫기', W / 2, 154);
  DEV_CHOICES.forEach((c, i) => {
    const bb = devBtn(i), hover = mouse.x >= bb.x && mouse.x <= bb.x + bb.w && mouse.y >= bb.y && mouse.y <= bb.y + bb.h;
    ctx.fillStyle = hover ? 'rgba(255,212,59,0.18)' : 'rgba(255,255,255,0.04)'; ctx.fillRect(bb.x, bb.y, bb.w, bb.h);
    ctx.strokeStyle = hover ? '#ffd43b' : 'rgba(255,212,59,0.35)'; ctx.strokeRect(bb.x + 0.5, bb.y + 0.5, bb.w, bb.h);
    ctx.textAlign = 'left'; ctx.font = `bold 18px ${FONT}`; ctx.fillStyle = '#ffe8a3'; ctx.fillText(`${i + 1}. ${c.name}`, bb.x + 20, bb.y + 30);
    ctx.font = `13px ${FONT}`; ctx.fillStyle = '#c8bc98'; ctx.fillText(c.help, bb.x + 20, bb.y + 55);
  });
}
// 게임 중으로 만든다 (제목 화면이면 새로 시작, 사후세계·미니게임이면 대화와 창을 닫음)
function devPrep() {
  if (state === 'title' || state === 'howto') newGame();
  if (state === 'afterlife' || state === 'mini') { closeTalk(); chat = null; mini = null; }
  state = 'play';
}
function devAll() {
  pts.soul = pts.tear = pts.grudge = 9999;
  for (const id of W_ORDER) { owned[id] = true; wlv[id] = 5; }
  weapon = 'vajra';
  uniques.hair = uniques.helm = true;
  for (const id of ['light', 'barrier', 'scream', 'charge']) learned[id] = true;
  slots[0] = 'light'; slots[1] = 'scream';
  up.hp = up.sp = 5; P.maxHp = 200; P.maxSp = 200; P.spRegen = 15; P.hp = P.maxHp; P.sp = P.maxSp;
}
function devPlace(x) {
  mons = []; shots = []; drops = []; effects = [];
  boss = null; bshots = []; bhands = []; bdecoys = []; bflee = []; bossEaten = 0; eboss = null; ebombs = [];
  lastSave = Math.max(lastSave, BOSS_SAVE); P.x = x; P.y = 390; P.vx = P.vy = P.kx = P.ky = 0; P.inv = 1;
  cam.x = P.x - W * 0.38;
}
function devPoints() {
  devPrep();
  pts.soul = pts.tear = pts.grudge = 9999;
  msg('제작자 코드 · 포인트 9999 충전', 3, '#ffd43b');
}
function devWarp() {
  if (state === 'ending') return;
  devPrep(); devAll();
  devPlace(BOSS_SAVE * SAVE_GAP + SAVE_W / 2);   // 5번째 등불 (보스 바로 앞 세이브 포인트)
  msg('제작자 코드 · 보스 바로 앞 · 모든 강화 완료', 3, '#ffd43b');
}
function devAfterBoss() {
  devPrep(); devAll();
  bossDone = true; bossSaved = 3; bossScene = 'village'; endingDelay = 0; ending = null;
  uniques.mask = true; codexSee('boss');
  nextElite = Math.max(nextElite, BX1 + 2500);
  devPlace(BX1 + 150);   // 남문 너머 (엔드리스 시작)
  msg('제작자 코드 · 무명귀를 잡은 뒤 · 엔드리스 시작', 3, '#ffd43b');
}
function onKey(code) {
  const digit = /^(Digit|Numpad)(\d)$/.exec(code);
  if (digit) { devKeys = (devKeys + digit[2]).slice(-8); if (devKeys.length === 8 && fnv(devKeys) === DEV_HASH) { devKeys = ''; openDevMenu(); return; } }
  if (devMenu) { devKey(code); return; }   // 제작자 코드 고르기 창

  if (state === 'mini') { miniKey(code); return; }
  if (code === 'KeyM') toggleMute();
  if (code === 'Escape' && (state === 'play' || state === 'title')) { openMenu(); return; }
  if (state === 'howto') { if (code === 'Space' || code === 'Enter') beginPlay(); return; }
  if (state === 'ending') {
    if (endingChoicesShown() && (code === 'Digit1' || code === 'Numpad1')) endingChoose(0);
    if (endingChoicesShown() && (code === 'Digit2' || code === 'Numpad2')) endingChoose(1);
    return;
  }
  if (state === 'afterlife') {
    if (talking) { if (code === 'Escape' || code === 'KeyF') closeTalk(); return; }
    if (chat) { if (code === 'Escape') chat = null; else if (code === 'KeyF') nextChat(); return; }
    if (code === 'Escape') { openMenu(); return; }
    if (code === 'KeyR') startWarp();
    if (code === 'KeyF') {

      else if (typeof n === 'string') openTalk(n);
      else if (n && n.fee) openMini(n);
      else if (n) openChat(n);
    }
    return;
  }
  if (state !== 'play') return;
  const n = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(code);
  if (n >= 0 && owned[W_ORDER[n]]) weapon = W_ORDER[n];
  if (code === 'Space') castSlot(1);
  if (code === 'KeyF' && zoneAt(P.x)) enterAfterlife();

let AC = null, master = null, muted = false;
function initAudio() {

    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    [55, 55.6, 82.4].forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.045;
      o.connect(g); g.connect(master); o.start();
    });
    const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 0.8;
    const lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 250; lfo.connect(lg); lg.connect(bp.frequency); lfo.start();

  } catch (e) { AC = null; }
}

function sfx(f, dur = 0.12, type = 'triangle', vol = 0.12, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}

// ===== 몬스터 소리 =====
// 소리 파일 없이 브라우저가 직접 만든다. 가까울수록 크게, 화면 왼쪽 몬스터는 왼쪽 스피커에서 들린다.

function noiseBuf() {
  if (!NOISE) {
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

}
function env(param, t0, dur, vol, att = 0.02) {
  param.setValueAtTime(0.0001, t0);

    const l = AC.createOscillator(), lg = AC.createGain();

    l.start(t0); l.stop(t0 + dur + 0.05);

  const g = AC.createGain(); env(g.gain, t0, dur, o.vol, o.att);
  src.connect(fl); fl.connect(g); g.connect(out);
  src.start(t0, Math.random() * 1.5); src.stop(t0 + dur + 0.05);

      dropPoint(k, amt, m.x + (Math.random() - 0.5) * 70, m.y + (Math.random() - 0.5) * 50);
    }
  }
  // 생기: 보통 몬스터는 8마리 중 1마리꼴로 조금, 강한 몬스터는 항상 조금 더 많이
  if (m.elite) dropPoint('life', LIFE_BIG, m.x + (Math.random() - 0.5) * 70, m.y + (Math.random() - 0.5) * 50);
  else if (Math.random() < 0.125) dropPoint('life', LIFE_SMALL, m.x + (Math.random() - 0.5) * 70, m.y + (Math.random() - 0.5) * 50);
  burst(mcx(m), mcy(m), m.ghost ? '#cfe8ff' : '#a89f8c', m.elite ? 40 : 14, m.elite ? 220 : 130, m.ghost);
  if (m.ghost) for (let i = 0; i < 6; i++) parts.push({ x: mcx(m) + Math.random() * 20 - 10, y: mcy(m), vx: Math.random() * 20 - 10, vy: -40 - Math.random() * 60, t: 1.2, max: 1.2, color: '#e7f5ff', size: 3, glow: true });
  monSound(m.type, 'die', m.x);
  if (m.type === 'boss') bossDefeated();
  if (m === eboss) ebossDefeated(m);
}

// ===== 스킬 =====
function castSlot(i) {
  const id = slots[i];
  if (!id) { msg(i === 0 ? '우클릭에 설정한 스킬이 없다 (사후세계 사서)' : '스페이스에 설정한 스킬이 없다 (사후세계 사서)', 1.6); return; }
  const s = SKILLS[id];
  if ((skillCd[id] || 0) > 0) return;
  if (P.sp < s.cost) { msg('영력이 부족하다', 1.2, '#b197fc'); return; }
  P.sp -= s.cost; skillCd[id] = s.cd;
  const a = aimAngle(), x = pcx(), y = pcy();
  if (id === 'light') {
    const len = 620, bx = x + Math.cos(a) * len, by = y + Math.sin(a) * len;
    effects.push({ kind: 'beam', x, y, ang: a, len, t: 0.35, max: 0.35 });
    for (const m of mons) if (!m.dead && m.fade > 0.3 && segDist(mcx(m), mcy(m), x, y, bx, by) < m.r + 14) hurt(m, 45, Math.cos(a), Math.sin(a), 120, 'skill');
    sfx(1500, 0.5, 'sine', 0.1, 600);
  } else if (id === 'barrier') {
    P.shield = 3; sfx(500, 0.6, 'sine', 0.1, 1000);
  } else if (id === 'scream') {
    effects.push({ kind: 'ring', x, y, r: 210, t: 0.6, max: 0.6, color: '255,120,140' });
    for (const m of mons) {
      if (m.dead || m.fade < 0.3) continue;
      const d = Math.hypot(mcx(m) - x, mcy(m) - y);
      if (d < 210 + m.r) { m.slow = 2.5; hurt(m, 32, (mcx(m) - x) / (d || 1), (mcy(m) - y) / (d || 1), 80, 'skill'); }
    }
    sfx(300, 0.7, 'sawtooth', 0.06, 1400);
  } else if (id === 'names') {
    // 무명귀의 기술: 이름 글자 7개를 부채꼴로 날린다
    for (let i = -3; i <= 3; i++) {
      const an = a + i * 0.15;
      shots.push({ x, y, vx: Math.cos(an) * 520, vy: Math.sin(an) * 520, dmg: 20, pierce: 2, hit: new Set(), t: 1.3, ang: an, ch: NAME_CHARS[Math.floor(Math.random() * NAME_CHARS.length)] });
    }
    sfx(500, 0.5, 'triangle', 0.08, 1000);
  } else if (id === 'charge') {
    P.dash = { vx: Math.cos(a) * 900, vy: Math.sin(a) * 900 * 0.7, t: 0.25, hit: new Set() };
    sfx(120, 0.3, 'sawtooth', 0.08, 60);
  }
}

// ===== 플레이어 피해 / 죽음 =====
function damagePlayer(dmg, src) {
  if (P.inv > 0 || P.shield > 0 || P.dash) return;
  P.hp -= dmg; P.inv = 0.7; hurtFlash = 0.35;
  if (src) { const dx = P.x - src.x, dy = P.y - src.y, d = Math.hypot(dx, dy) || 1; P.kx = dx / d * 260; P.ky = dy / d * 160; }
  sfx(90, 0.2, 'square', 0.08, 50);
}
function respawn() {
  const lost = Math.floor(pts.soul * 0.3);
  pts.soul -= lost;
  const eliteLeft = mons.some(m => m.elite && !m.dead && m.type !== 'boss' && !isEboss(m));
  // 엔드리스 보스와 싸우다 죽으면 조금 뒤 다시 나온다
  const ebLeft = !!eboss; eboss = null; ebombs = [];
  // 보스와 싸우다 죽으면 그 단계부터 다시 (bossSaved 는 단계가 바뀔 때 저장됨)
  boss = null; bshots = []; bhands = []; bdecoys = []; bflee = []; bossEaten = 0;
  mons = []; shots = []; effects = []; drops = [];
  // 죽으면 마지막 등불부터 앞쪽 구간의 몬스터가 처음부터 다시 나온다
  for (const s in segSpawned) if (+s >= lastSave) delete segSpawned[s];
  P.x = lastSave ? lastSave * SAVE_GAP + SAVE_W / 2 : 140; P.y = 390;
  P.hp = P.maxHp; P.sp = P.maxSp; P.inv = 1.5; P.slow = 0; P.dash = null; P.kx = P.ky = 0; P.vx = P.vy = 0;
  // 못 잡은 강한 몬스터는 다시 나온다
  if (eliteLeft) { eliteIdx--; nextElite = P.x + 900; }
  if (ebLeft) nextEboss = P.x + 1500;
  else nextElite = Math.max(nextElite, P.x + 900);
  cam.x = P.x - W * 0.38;
  state = 'play';
  msg(lost ? `혼불 ${lost}개를 잃고 등불 아래에서 깨어났다` : '등불 아래에서 깨어났다', 3);
}

  if (z) {
    if (z > lastSave) {
      lastSave = z;
      // 세이브 포인트에 처음 왔을 때 한 번만, 비어 있는 체력의 2/3 만 채운다 (다 차면 피할 생각을 안 하게 돼서)
      const heal = Math.round((P.maxHp - P.hp) * 2 / 3);
      P.hp = Math.min(P.maxHp, P.hp + heal);
      msg(`세이브 포인트 · 저승 등불 ${z}번째`, 2.5, '#9ef0e4');
      if (heal > 0) floatText(P.x, P.y - 70, `체력 +${heal}`, '#ff8a9a', 15);
      sfx(520, 0.8, 'sine', 0.08, 780);
    }
  }
  P.sp = Math.min(P.maxSp, P.sp + P.spRegen * (z ? 3 : 1) * dt);
  if (!boss && !eboss) {
    if (backOK && P.x - cam.x < W * 0.3) cam.x = Math.max(0, P.x - W * 0.3);
    cam.x = Math.max(cam.x, P.x - W * 0.38);
  }
  // 보스: 남문 앞에 오면 싸움 시작. 싸우는 동안은 화면 한 칸 안에 갇히고, 잡기 전에는 남문 너머로 못 간다
  if (!bossDone && !boss && P.x > BX0 + 140) startBoss();
  if (bossDone && !boss && !eboss && state === 'play' && P.x > (nextEboss < 0 ? EBOSS_FIRST : nextEboss) && !arenaHasZone(cam.x)) spawnEboss();   // 싸우는 칸 안에 세이브 지역이 없을 때만
  if (eboss) { P.x = clamp(P.x, ebossX0 + 30, ebossX0 + W - 30); cam.x += (ebossX0 - cam.x) * ease(5, dt); }
  if (boss) { P.x = clamp(P.x, BX0 + 30, BX1 - 30); cam.x += (BX0 - cam.x) * ease(5, dt); }
  else if (!bossDone && P.x > BX1 - 30) P.x = BX1 - 30;
  if (endingDelay > 0) { endingDelay -= dt; if (endingDelay <= 0) { state = 'ending'; ending = { t: 0 }; mouse.down = false; } }

  if (mouse.down) attack();

  // 몬스터 나오기 (보스 자리 근처에서는 안 나옴)
  if (!z && !inBossArea()) {
    spawnT -= dt;
    if (spawnT <= 0) { spawnT = Math.max(0.55, 2.4 - P.x / 3000) * (0.7 + Math.random() * 0.6); trySpawn(); }
    if (P.x > nextElite) spawnElite();
  }

  // 몬스터 움직임
  let eliteAlive = false;
  for (const m of mons) {
    if (m.dead) continue;
    if (m.elite) eliteAlive = true;
    if (!codex.seen[m.type] && m.fade > 0.5 && m.x > cam.x && m.x < cam.x + W) codexSee(m.type);   // 화면에 처음 보이면 도감에 기록
    if (m.type === 'boss') { updateBoss(m, dt); continue; }
    if (m.type === 'shadowex' || m.type === 'shadowclone') { updateShadowEx(m, dt); continue; }
    if (m.type === 'yahaeng') { updateYahaeng(m, dt); continue; }
    m.t += dt; m.flash -= dt; m.slow -= dt;
    if (m.fade < 1 && m.vanish == null) m.fade = Math.min(1, m.fade + dt * 0.9);
    const dx = P.x - m.x, dy = P.y - m.y, d = Math.hypot(dx, dy) || 1;
    const sp = m.speed * (m.slow > 0 ? 0.45 : 1);
    let vx = dx / d * sp, vy = dy / d * sp;
    if (m.ghost) m.hover = 14 + Math.sin(m.t * 2 + m.seed * 9) * 6;
    m.acd = (m.acd ?? 0.5) - dt;
    // 평소 소리 (가까이 있을 때 가끔) · 해골 기사는 걸을 때 갑옷 소리
    m.sndT = (m.sndT ?? 1 + Math.random() * 4) - dt;
    if (m.sndT <= 0) { m.sndT = 3.5 + Math.random() * 5; if (!m.atk && !z && Math.abs(m.x - P.x) < 800 && m.fade > 0.5) monSound(m.type, 'idle', m.x); }
    if (m.type === 'knight' && (m.amp ?? 0) > 0.4) { m.stepT = (m.stepT ?? 0) - dt; if (m.stepT <= 0) { m.stepT = m.cs === 'charge' ? 0.18 : 0.45; monSound('knight', 'step', m.x); } }
    if (z) {
      // 내가 세이브 포인트 안에 있으면 몬스터는 쫓아오지 않고 길 전체로 퍼져서 제멋대로 떠돈다
      if (m.vanish != null) m.vanish = null;
      if (m.type === 'knight') { m.cs = 'walk'; m.ct = 3; }
      m.atk = null;
      if (m.wseg !== z) {
        // 오른쪽 몬스터는 이번 등불~다음 등불 사이, 왼쪽 몬스터는 지나온 길에 퍼진다
        const sx = z * SAVE_GAP;
        if (m.x >= sx + SAVE_W / 2) { m.wa = sx + SAVE_W + 50; m.wb = (z + 1) * SAVE_GAP - 50; }
        else { m.wa = (z - 1) * SAVE_GAP + (z > 1 ? SAVE_W : 0) + 50; m.wb = sx - 50; }
        m.wseg = z;
        m.wx = m.wa + Math.random() * (m.wb - m.wa);
        m.wy = ROAD_TOP + 20 + Math.random() * (ROAD_BOT - ROAD_TOP - 20);
        m.wt = Math.abs(m.wx - m.x) / (m.speed * 0.7) + 1;
      }
      m.wt -= dt;
      if (m.wt <= 0) {
        m.wx = clamp(m.x + (Math.random() - 0.5) * 500, m.wa, m.wb);
        m.wy = ROAD_TOP + 20 + Math.random() * (ROAD_BOT - ROAD_TOP - 20);
        m.wt = 3 + Math.random() * 3;
      }
      const wdx = m.wx - m.x, wdy = m.wy - m.y, wd = Math.hypot(wdx, wdy) || 1;
      const ws = wd < 8 ? 0 : m.speed * 0.7;
      vx = wdx / wd * ws; vy = wdy / wd * ws;
    } else m.wseg = null;
    if (m.type === 'wisp' && !m.atk) vy += Math.sin(m.t * 3 + m.seed * 6) * 50;
    if (m.type === 'bat') { m.hover = 46 + Math.sin(m.t * 9 + m.seed * 9) * 6; if (!m.atk) { vx += Math.sin(m.t * 7 + m.seed * 9) * 90; vy += Math.cos(m.t * 5 + m.seed * 5) * 70; } }
    if (m.type === 'witch') {
      m.hover = 40 + Math.sin(m.t * 1.7 + m.seed * 9) * 8;
      if (!z && !m.atk) {
        // 너무 가까우면 물러나고, 너무 멀면 다가오고, 그 사이에서는 위아래로 떠다닌다
        const want = d < 260 ? -1 : d > 380 ? 1 : 0;
        vx = dx / d * sp * want; vy = want ? dy / d * sp * want : Math.sin(m.t * 1.3 + m.seed * 7) * sp * 0.6;
      }
    }
    if (z) { /* 떠도는 중에는 특수 행동 없음 */ }
    else if (m.type === 'shade') {
      m.st = (m.st ?? 1) - dt;
      if (m.st <= 0) { m.dashing = !m.dashing; m.st = m.dashing ? 0.5 : 1.1; if (m.dashing && m.fade > 0.5) monSound('shade', 'dash', m.x); }
      const f = m.dashing ? 2.6 : 0.35; vx *= f; vy *= f;
    }
    if (m.type === 'wongwi' && !z) {
      // 사라졌다가 내 근처에 다시 나타남 (천천히)
      m.tp = (m.tp ?? 4) - dt;
      if (m.tp <= 0 && m.vanish == null && !m.atk) { m.vanish = 0.8; monSound('wongwi', 'vanish', m.x); }
      if (m.vanish != null) {
        m.vanish -= dt; m.fade = Math.max(0, m.vanish / 0.8); vx = vy = 0;
        if (m.vanish <= 0) {
          const a = Math.random() * Math.PI * 2;
          m.x = P.x + Math.cos(a) * 180; m.y = clamp(P.y + Math.sin(a) * 90, ROAD_TOP + 20, ROAD_BOT);
          m.vanish = null; m.fade = 0; m.tp = 4 + Math.random() * 2; monSound('wongwi', 'appear', m.x);
        }
      }
      m.sc = (m.sc ?? 6) - dt;
      if (m.sc <= 0 && m.fade > 0.8 && !m.atk) {
        m.sc = 7;
        effects.push({ kind: 'ring', x: mcx(m), y: mcy(m), r: 240, t: 0.8, max: 0.8, color: '200,60,90' });
        monSound('wongwi', 'scream', m.x);
        if (d < 240) { P.slow = 2; damagePlayer(6, null); msg('원귀의 비명에 몸이 굳는다…', 1.5, '#ff8fa3'); }
      }
    }
    if (m.type === 'knight' && !z) {
      m.cs = m.cs || 'walk'; m.ct = (m.ct ?? 5) - dt;
      if (m.cs === 'walk' && m.ct <= 0 && !m.atk) { m.cs = 'aim'; m.ct = 0.9; m.dir = Math.atan2(dy, dx); monSound('knight', 'aim', m.x); }
      else if (m.cs === 'aim') { vx = vy = 0; if (m.ct <= 0) { m.cs = 'charge'; m.ct = 0.7; monSound('knight', 'charge', m.x); } }
      else if (m.cs === 'charge') { vx = Math.cos(m.dir) * sp * 5; vy = Math.sin(m.dir) * sp * 5; if (m.ct <= 0) { m.cs = 'walk'; m.ct = 4 + Math.random() * 2; } }
    }
    // 공격 동작: 준비(wind) → 공격(hit) → 숨 고르기(rec)
    const A = MON[m.type].atk;
    const busy = m.vanish != null || m.fade < 0.8 || (m.type === 'knight' && m.cs !== 'walk');
    if (!z && !m.atk && !busy && m.acd <= 0 && d < A.trigger) {
      m.atk = { phase: 'wind', t: A.wind, ang: Math.atan2(dy, dx), done: false };
      monSound(m.type, 'wind', m.x);
    }
    if (m.atk) {
      const k = m.atk;
      k.t -= dt;
      vx = vy = 0;
      if (k.phase === 'wind') {
        if (k.t <= 0) { k.phase = 'hit'; k.t = A.hit; if (A.kind === 'lunge') monSound(m.type, 'hit', m.x); }
      } else if (k.phase === 'hit') {
        if (A.kind === 'shoot') {
          // 저주 불덩이를 나를 향해 던진다 (칼로 베어 없앨 수 있음)
          if (!k.done) {
            k.done = true;
            const sx0 = m.x + m.face * 14, sy0 = m.y - m.hover - 30, an = Math.atan2(P.y - 28 - sy0, P.x - sx0);
            bshots.push({ x: sx0, y: sy0, vx: Math.cos(an) * 240, vy: Math.sin(an) * 240, t: 3, kind: 'fire', dmg: m.dmg });
            monSound(m.type, 'hit', m.x);
          }
        } else if (A.kind === 'lunge') {
          // 몸으로 날아들기: 날아가는 동안 닿으면 피해
          vx = Math.cos(k.ang) * A.lungeSpd; vy = Math.sin(k.ang) * A.lungeSpd;
          if (!k.done && d < m.r + 18) { k.done = true; damagePlayer(m.dmg, m); }
        } else {
          if (A.lunge) { vx = Math.cos(k.ang) * A.lunge / A.hit; vy = Math.sin(k.ang) * A.lunge / A.hit; }
          if (!k.done) {
            // 휘두르는 방향 앞쪽에 있을 때만 맞는다
            k.done = true;
            effects.push({ kind: 'mslash', x: m.x + Math.cos(k.ang) * 10, y: m.y - m.r * 1.3, ang: k.ang, range: A.reach, t: 0.18, max: 0.18, color: m.ghost ? '170,140,255' : '255,90,70' });
            if (d < A.reach && angDiff(Math.atan2(dy, dx), k.ang) < 1.1) damagePlayer(m.dmg, m);
            monSound(m.type, 'hit', m.x);
          }
        }
        if (k.t <= 0) { k.phase = 'rec'; k.t = A.rec; }
      } else if (k.t <= 0) { m.atk = null; m.acd = A.cd; }
    }
    // 속도가 순간적으로 바뀌지 않고 서서히 바뀐다 (공격으로 몸을 날릴 때와 돌진할 때는 빠르게)
    const rate = m.atk && m.atk.phase === 'hit' ? 40 : m.type === 'knight' && m.cs === 'charge' ? 20 : 7;
    m.svx = (m.svx ?? vx) + (vx - (m.svx ?? vx)) * ease(rate, dt);
    m.svy = (m.svy ?? vy) + (vy - (m.svy ?? vy)) * ease(rate, dt);
    // 보는 방향: 공격 중에는 공격하는 쪽, 아니면 움직이는 쪽. 돌아설 때는 서서히 몸을 돌린다
    if (m.atk) m.face = Math.cos(m.atk.ang) >= 0 ? 1 : -1;
    else if (Math.abs(m.svx) > 3) m.face = m.svx > 0 ? 1 : -1;
    m.fs = (m.fs ?? m.face ?? 1) + ((m.face ?? 1) - (m.fs ?? m.face ?? 1)) * ease(14, dt);
    // 다리 움직임 크기: 빨리 걸을수록 크게, 멈추면 서서히 제자리로
    const goAmp = m.atk ? 0 : clamp(Math.hypot(m.svx, m.svy) / (m.speed * 0.6), 0, 1);
    m.amp = (m.amp ?? 0) + (goAmp - (m.amp ?? 0)) * ease(8, dt);
    const kf = Math.pow(0.01, dt);
    m.x += (m.svx + m.vx) * dt; m.y += (m.svy + m.vy) * dt; m.vx *= kf; m.vy *= kf;
    m.y = clamp(m.y, ROAD_TOP + 14, ROAD_BOT);
    // 세이브 포인트 안으로는 못 들어옴
    const zi = inZoneWide(m.x, m.r);
    if (zi) { const sx = zi * SAVE_GAP; m.x = m.x < sx + SAVE_W / 2 ? sx - m.r : sx + SAVE_W + m.r; }
    // 결계
    if (P.shield > 0 && d < 95) { m.x = P.x - dx / d * 95; m.y = P.y - dy / d * 95; }
    // 해골 기사의 돌진은 몸으로 부딪친다
    if (m.type === 'knight' && m.cs === 'charge' && d < m.r + 18) damagePlayer(m.dmg, m);
    // 아주 멀리 뒤처진 몬스터만 사라진다 (뒤로 돌아가서 잡을 수 있게)
    if (m.x < cam.x - 1400 && !m.wseg) m.dead = true;
  }
  // 좀비·해골끼리는 겹치지 않음
  for (let i = 0; i < mons.length; i++) for (let j = i + 1; j < mons.length; j++) {
    const a = mons[i], b = mons[j];
    if (a.ghost || b.ghost || a.dead || b.dead) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, o = a.r + b.r - d;
    if (o > 0) { a.x -= dx / d * o / 2; a.y -= dy / d * o / 2; b.x += dx / d * o / 2; b.y += dy / d * o / 2; }
  }
  mons = mons.filter(m => !m.dead);

  // 심장 소리 (강한 몬스터가 있을 때)
  if (eliteAlive) { beat -= dt; if (beat <= 0) { beat = 0.9; sfx(55, 0.18, 'sine', 0.35, 40); setTimeout(() => sfx(50, 0.15, 'sine', 0.25, 38), 180); } }

  // 부적
  for (const s of shots) {
    if (s.trail) { s.trail.unshift({ x: s.x, y: s.y }); if (s.trail.length > 6) s.trail.pop(); }
    s.x += s.vx * dt; s.y += s.vy * dt; s.t -= dt;
    for (const m of mons) {
      if (m.dead || s.hit.has(m) || m.fade < 0.3) continue;
      if (Math.hypot(mcx(m) - s.x, mcy(m) - s.y) < m.r + 8) {
        s.hit.add(m); hurt(m, s.dmg, s.vx / 560, s.vy / 560, 60, s.ch ? 'skill' : 'talisman');
        if (s.hit.size > s.pierce) { s.t = 0; break; }
      }
    }
  }
  shots = shots.filter(s => s.t > 0);
  updateBossThings(dt);
  updateEbombs(dt);
  // 포인트: 줍기, 그리고 가끔 길에 저절로 떨어져 있는 것
  updateDrops(dt);
  if (!z && !inBossArea()) {
    natT -= dt;
    if (natT <= 0) {
      natT = 5 + Math.random() * 6;
      const x = cam.x + W + 60 + Math.random() * 300, r = Math.random();
      // 길에 저절로 떨어진 것: 혼불 65% · 생기 15% · 망자의 눈물 15% · 원념 조각 5%
      const kind = r < 0.65 ? 'soul' : r < 0.8 ? 'life' : r < 0.95 ? 'tear' : 'grudge';
      const amt = kind === 'soul' ? 1 + Math.floor(Math.random() * 3) : kind === 'life' ? LIFE_SMALL : 1;
      if (!inZoneWide(x, 40)) dropPoint(kind, amt, x, ROAD_TOP + 20 + Math.random() * (ROAD_BOT - ROAD_TOP - 20));
    }
  }
  effects.forEach(e => e.t -= dt); effects = effects.filter(e => e.t > 0);
  parts.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; p.t -= dt; }); parts = parts.filter(p => p.t > 0);
  texts.forEach(t => { t.y -= 30 * dt; t.t -= dt; }); texts = texts.filter(t => t.t > 0);

  if (P.hp <= 0) { P.hp = 0; state = 'dead'; deadT = 0; mouse.down = false; sfx(110, 1.5, 'sine', 0.15, 40); }
}

// ===== 최종 보스: 무명귀 (이름을 먹는 악귀) =====
// 5번째 등불 너머, 마을 남문 앞에서 문을 두드리고 있다.
//   1단계 (체력 100~66%): 남문 앞. 긴 팔 휘두르기 · 이름 글자 날리기 · 눈알 혼령 부르기
//   2단계 (66~33%)      : 어둠 속으로 숨는다. 몸은 거의 안 보이고, 가짜 눈들 사이에서 진짜 눈을 찾아야 한다. 땅에서 손이 솟는다
//   3단계 (33~0%)       : 남문을 부수고 마을로 쳐들어간다. 시민들이 도망가고, 무명귀가 화면의 글자(이름)를 하나씩 먹는다
// 죽으면 그 단계부터 다시 시작한다.
const BOSS_SAVE = 5;                                  // 5번째 등불 다음이 보스 자리
const BX0 = BOSS_SAVE * SAVE_GAP + SAVE_W + 320;      // 싸우는 곳 왼쪽 끝
const BX1 = BX0 + W;                                  // 싸우는 곳 오른쪽 끝 (화면 한 칸)
const GATE_X = BX1 - 170;                             // 남문 자리
MON.boss = { name: '무명귀', hp: 2600, speed: 34, dmg: 18, r: 58, ghost: true, elite: true, drop: { soul: 120, tear: 15, grudge: 10 }, unique: 'mask' };
UNIQUES.mask = { name: '무명귀의 가면', from: '무명귀' };
SKILLS.names = { name: '이름 부르기', cd: 8, cost: 25, price: { tear: 8 }, need: 'mask', desc: '이름 글자 7개를 부채꼴로 날림 (무명귀의 기술)' };
// 난이도: 공격마다 피해량 · 단계마다 공격 사이 쉬는 시간(초)
const BOSS_DMG = { sweep: 28, name: 12, hand: 24, grab: 20 };
const BOSS_REST = [0, 1.1, 0.9, 0.65];
const NAME_CHARS = '순복길덕분옥점남말개동철영숙자봉쇠막춘금'.split('');
const EAT_LABELS = ['체력', '영력', '혼불', '망자의 눈물', '원념 조각'];   // 3단계에서 먹히는 글자 순서
// 보스 상태 (newGame 보다 먼저 쓰일 수 있어서 var)
var boss = null, bossDone = false, bossSaved = 1, bossScene = 'gate', bossEaten = 0;
var bshots = [], bhands = [], bdecoys = [], bflee = [], gateShake = 0, endingDelay = 0, ending = null;
function resetBoss() {
  eboss = null; ebossIdx = 0; nextEboss = -1; ebombs = [];   // -1 = 아직 안 정함 (처음 보스 자리는 EBOSS_FIRST)
  boss = null; bossDone = false; bossSaved = 1; bossScene = 'gate'; bossEaten = 0;
  bshots = []; bhands = []; bdecoys = []; bflee = []; gateShake = 0; endingDelay = 0; ending = null;
}
const eatName = (i, text) => (boss && bossEaten > i ? '???' : text);
const inBossArea = () => (!bossDone && P.x > BX0 - 500) || !!eboss;

function startBoss() {
  mons = []; shots = []; bshots = []; bhands = []; bflee = [];

        warmGlowPlay(x, y, 26, '120,255,90', 0.55);
        for (let i = 0; i < 3; i++) warmGlowPlay(x - s.vx * 0.02 * (i + 1), y - s.vy * 0.02 * (i + 1), 12 - i * 3, '160,255,120', 0.3 - i * 0.08);
        ctx.fillStyle = '#e8862a'; ctx.beginPath(); ctx.ellipse(x, y, 6, 5, 0, 0, 7); ctx.fill();

function warmGlowPlay(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function drawBoss(m) {
  const x = m.x - cam.x, y = m.y, f = m.fs ?? 1, t = m.t;
  const hy = y - m.hover;
  const a = m.act, T = a ? a.T : null;
  let w = 0, hk = 0;
  if (a && a.phase === 'wind') w = clamp(1 - a.t / T[0], 0, 1);
  else if (a && a.phase === 'hit') { hk = clamp((T[1] - a.t) / Math.min(0.1, T[1]), 0, 1); w = 1 - hk; }
  else if (a && a.phase === 'rec') hk = clamp(a.t / T[2], 0, 1);
  const kind = a ? a.kind : null;
  const shake = m.flash > 0 ? (Math.random() - 0.5) * 5 : 0;
  const bodyA = m.fade * (m.phase === 2 ? (m.trans > 0 ? clamp(1 - (1.4 - m.trans) / 1, 0.14, 1) : 0.14) : 1);
  ctx.save();
  ctx.globalAlpha = bodyA;
  shadow(x, y, 46);
  ctx.translate(shake, 0);
  // 너덜너덜한 긴 옷자락
  const g = ctx.createLinearGradient(0, hy - 200, 0, hy + 10);
  g.addColorStop(0, 'rgba(44,36,60,0.97)'); g.addColorStop(0.8, 'rgba(40,32,56,0.9)'); g.addColorStop(1, 'rgba(40,32,56,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(x - 24, hy - 185);
  ctx.quadraticCurveTo(x - 40, hy - 100, x - 46 + Math.sin(t * 2) * 4, hy + 6);
  for (let i = 0; i <= 8; i++) ctx.lineTo(x - 46 + i * 11.5, hy + 6 + Math.sin(t * 3 + i * 1.7) * 7 + (i % 2) * 9);
  ctx.quadraticCurveTo(x + 40, hy - 100, x + 24, hy - 185); ctx.fill();
  // 옷자락 양옆 테두리 (어두운 담장과 구분되게)
  ctx.strokeStyle = 'rgba(170,150,220,0.32)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 24, hy - 185); ctx.quadraticCurveTo(x - 40, hy - 100, x - 46 + Math.sin(t * 2) * 4, hy - 4);
  ctx.moveTo(x + 24, hy - 185); ctx.quadraticCurveTo(x + 40, hy - 100, x + 46, hy - 4); ctx.stroke();
  // 옷자락에 붙은 작은 눈들 (뜨고 감음)
  for (let i = 0; i < 7; i++) {
    const ex = x + (hash(i, 300) - 0.5) * 50, ey = hy - 40 - hash(i, 301) * 120, open = Math.max(0, Math.sin(t * (0.6 + hash(i, 302)) + i * 2)) * (m.phase === 3 ? 1 : 0.6);
    ctx.fillStyle = 'rgba(230,225,240,0.85)'; ctx.beginPath(); ctx.ellipse(ex, ey, 4, 2.6 * open + 0.3, 0, 0, 7); ctx.fill();
    if (open > 0.3) { ctx.fillStyle = '#300'; ctx.beginPath(); ctx.arc(ex + f, ey, 1.3, 0, 7); ctx.fill(); }
  }
  // 긴 팔: 평소엔 늘어뜨리고, 공격마다 자세가 이어서 바뀐다
  const P2 = (ax, ay) => [x + ax, hy + ay];
  let front = P2(f * 46, -30 + Math.sin(t * 1.3) * 6), back = P2(-f * 40, -26 + Math.sin(t * 1.1 + 1) * 6);
  if (m.intro > 1.3 && bossSaved === 1) { const kn = Math.abs(Math.sin(t * 5.1)); front = P2(f * (70 + 40 * kn), -150 + 20 * kn); }
  const mix = (p0, p1, k) => [lerp(p0[0], p1[0], k), lerp(p0[1], p1[1], k)];
  if (kind === 'sweep') { front = mix(mix(front, P2(-f * 30, -270), w), P2(f * 240, -100), hk); }
  else if (kind === 'names') { const k2 = Math.max(w, hk); front = mix(front, P2(f * 70, -250), k2); back = mix(back, P2(-f * 70, -250), k2); }
  else if (kind === 'hands') { const k2 = Math.max(w, hk); front = mix(front, P2(f * 40, 8), k2); back = mix(back, P2(-f * 40, 8), k2); }
  else if (kind === 'eyes') { const k2 = Math.max(w, hk); front = mix(front, P2(f * 110, -140), k2); back = mix(back, P2(-f * 110, -140), k2); }
  else if (kind === 'grab') { front = mix(mix(front, P2(-f * 30, -180), w), [m.x - cam.x + Math.cos(a.ang) * 360, y - 110 + Math.sin(a.ang) * 360], hk); }
  for (const [end, sh] of [[back, -1], [front, 1]]) {
    const shx = x + f * sh * 20, shy = hy - 172;
    // 긴 팔: 희미한 테두리 위에 짙은 색
    ctx.lineCap = 'round';
    for (const [col, lw] of [['rgba(170,150,220,0.3)', 9], ['rgba(52,42,70,0.98)', 6]]) {
      ctx.strokeStyle = col; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(shx, shy); ctx.quadraticCurveTo((shx + end[0]) / 2 + f * sh * 30, (shy + end[1]) / 2 - 20, end[0], end[1]); ctx.stroke();
    }
    const ang = Math.atan2(end[1] - shy, end[0] - shx);
    ctx.strokeStyle = 'rgba(200,200,215,0.9)'; ctx.lineWidth = 2;   // 길고 하얀 손가락
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(end[0], end[1]); ctx.lineTo(end[0] + Math.cos(ang + k * 0.22) * 22, end[1] + Math.sin(ang + k * 0.22) * 22); ctx.stroke(); }
  }
  // 얼굴 없는 하얀 가면
  const mx = x + f * 2, my = hy - 205;
  ctx.fillStyle = '#e8e4dc'; ctx.beginPath(); ctx.ellipse(mx, my, 22, 29, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0c0a10'; ctx.beginPath(); ctx.ellipse(mx - 8, my - 3, 4.5, 3, 0, 0, 7); ctx.ellipse(mx + 8, my - 3, 4.5, 3, 0, 0, 7); ctx.fill();
  if (m.phase >= 2) { ctx.strokeStyle = '#3a3238'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(mx + 4, my - 28); ctx.lineTo(mx + 1, my - 12); ctx.lineTo(mx + 6, my + 2); ctx.lineTo(mx + 2, my + 18); ctx.stroke(); }
  if (m.phase === 3) for (let i = 0; i < 4; i++) { ctx.fillStyle = '#700'; ctx.beginPath(); ctx.arc(mx - 10 + i * 7, my + 12 + (i % 2) * 5, 1.6, 0, 7); ctx.fill(); }
  ctx.restore();
  // 진짜 눈 (어둠 위에 빛남) · 몸 주위를 도는 이름 글자
  const eyeA = m.fade;
  if (!blinking(m.seed) || (a && a.phase === 'wind')) {
    const er = a && a.phase === 'wind' ? 3.6 : 2.6;
    glows.push(() => eyeGlow([[mx - 8, my - 3], [mx + 8, my - 3]], '235,230,255', er, eyeA));
  }
  glows.push(() => {
    ctx.font = `16px ${FONT}`; ctx.textAlign = 'center';
    for (let i = 0; i < 9; i++) {
      const an = t * 0.5 + i / 9 * Math.PI * 2, r = 80 + Math.sin(t + i) * 14;
      ctx.fillStyle = `rgba(255,214,236,${0.35 * bodyA})`;
      ctx.fillText(NAME_CHARS[i], x + Math.cos(an) * r, hy - 110 + Math.sin(an) * r * 0.5);
    }
  });
  // 붙잡기 준비: 붉은 점선으로 방향을 보여 준다
  if (kind === 'grab' && a.phase === 'wind') glows.push(() => {
    ctx.strokeStyle = `rgba(255,60,90,${0.4 + 0.4 * Math.sin(time * 30)})`; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
    ctx.beginPath(); ctx.moveTo(m.x - cam.x, y - 110); ctx.lineTo(m.x - cam.x + Math.cos(a.ang) * 380, y - 110 + Math.sin(a.ang) * 380); ctx.stroke(); ctx.setLineDash([]);
  });
  // 휘두르기 준비: 닿는 범위를 희미하게 보여 준다
  if (kind === 'sweep' && a.phase === 'wind') glows.push(() => {
    ctx.fillStyle = `rgba(200,120,255,${0.12 + 0.14 * w})`;
    ctx.beginPath(); ctx.moveTo(x, y - 20); ctx.arc(x, y - 20, 250, f > 0 ? -0.35 : Math.PI - 0.35, f > 0 ? 0.35 : Math.PI + 0.35); ctx.fill();
  });
  lights.push({ x, y: hy - 120, r: 120, a: 0.25 * bodyA });
}

// 칼·금강저가 지나간 자국: 칼끝을 따라 그려지는 초승달 (머리는 진하고 꼬리는 흐리게)
function drawWeaponSlash(e, x) {
  const life = 1 - e.t / e.max;                        // 0 → 1
  const sweep = clamp((life * e.max - (e.delay || 0)) / (e.sweepT || 0.1), 0, 1);
  if (sweep <= 0) return;

  const half = e.arc / 2, start = e.ang - e.dir * half;

  const tail = head - e.dir * Math.min(e.arc * (big ? 0.9 : 0.7), Math.abs(head - start));

}
function drawEffects() {

  for (let r = 0; r < 5; r++) for (let k = -1; k < W / 40 + 1; k++) ctx.strokeRect(k * 40 - (acam % 40) + (r % 2) * 20, top + r * 14, 40, 14);
  ctx.fillStyle = '#121b1d'; ctx.fillRect(0, top - 10, W, 12);
  // 5번째 등불까지 왔는데 무명귀를 아직 못 잡았으면, 마을 안에서도 남문이 쾅쾅 흔들린다
  const knocking = lastSave >= BOSS_SAVE && !bossDone;
  const gx = AW / 2 - acam + (knocking && gateShake > 0 ? Math.sin(time * 80) * 3 * gateShake : 0);
  if (gx > -120 && gx < W + 120) {
    if (bossDone) {
      // 열린 남문: 문짝이 양쪽으로 열려 있고 그 너머로 저승길 빛이 보인다
      ctx.fillStyle = '#081416'; ctx.fillRect(gx - 50, b - 96, 100, 96);
      warmGlow(gx, b - 40, 60, '160,255,235', 0.35);
      ctx.fillStyle = '#5a2620'; ctx.fillRect(gx - 64, b - 96, 14, 96); ctx.fillRect(gx + 50, b - 96, 14, 96);
    } else {
      ctx.fillStyle = '#5a2620'; ctx.fillRect(gx - 50, b - 96, 100, 96);
      ctx.fillStyle = '#3a1814'; ctx.fillRect(gx - 1, b - 96, 2, 96);
      ctx.fillStyle = '#b8a070'; for (let r = 0; r < 4; r++) for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(gx + s * (12 + k * 13), b - 82 + r * 22, 2, 0, 7); ctx.fill(); }
      ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(gx - 10, b - 50); ctx.lineTo(gx + 10, b - 50); ctx.stroke();   // 빗장
    }
    giwaRoof(gx, 130, b - 96, 1);
  }
}
function drawVObj(o) {
  const x = o.x - acam;
  if (o.k !== 'wall' && (x + o.w / 2 + 60 < 0 || x - o.w / 2 - 60 > W)) return;
  if (o.b < acamY - 20 || o.b - 230 > acamY + H) return;
  VB = o.b;
  switch (o.k) {
    case 'house': drawHouse(x, o.w, o.h, o.seed, o.tiers || 1); break;
    case 'jars': drawJars(x); break;
    case 'laundry': drawLaundry(x); break;
    case 'pond': drawPond(x); break;
    case 'lanterns': drawLanternString(x, o.w); break;
    case 'pagoda': drawPagoda(x); break;
    case 'bamboo': drawBamboo(x, o.w); break;
    case 'temple': drawTemple(x, o.w, o.h, o.seed); break;
    case 'bell': drawBellPavilion(x); break;
    case 'shrine': drawShrine(x); break;
    case 'tavern': drawTavern(x, o.w, o.h, o.seed); break;
    case 'wall': drawSouthWall(); break;
  }
  if (o.sign) {
    const sy = { temple: o.b - 150, tavern: o.b - 112, pagoda: o.b - 160, bell: o.b - 140, shrine: o.b - 110, wall: o.b - 112 }[o.k] || o.b - 100;
    sign(o.k === 'wall' ? AW / 2 - acam : x, sy, o.k === 'wall' && bossDone ? '남문 · 열림' : o.sign);
  }
}
// 줄마다 길가에 선 돌 등불
const ROW_LAMPS = [];
ROWS.slice(1).forEach(b => { for (let i = 0; i < 6; i++) ROW_LAMPS.push({ x: 140 + i * 500, y: b + 226 }); });
function drawRowLamp(l) {
  const x = l.x - acam, y = l.y;
  if (x < -40 || x > W + 40 || y < acamY - 10 || y - 60 > acamY + H) return;
  ctx.fillStyle = '#29393b'; ctx.fillRect(x - 5, y - 30, 10, 30); ctx.fillRect(x - 12, y - 42, 24, 12); ctx.fillRect(x - 15, y - 46, 30, 5);
  warmGlow(x, y - 36, 26, '160,255,235', 0.55);
}

// --- 사후세계에서 위아래로 걸을 때의 앞모습 · 뒷모습 ---
function drawPlayerFB(x, y, view) {
  const step = Math.sin(P.walk * 11) * P.amp;
  shadow(x, y, 15);
  const by = y - Math.abs(step) * 2;
  // 발 (번갈아 앞뒤로)
  ctx.fillStyle = '#0d0d12';
  ctx.beginPath(); ctx.ellipse(x - 6, y - 2 - step * 2, 4.5, 3, 0, 0, 7); ctx.ellipse(x + 6, y - 2 + step * 2, 4.5, 3, 0, 0, 7); ctx.fill();
  // 두루마기
  ctx.fillStyle = '#20263f';
  ctx.beginPath(); ctx.moveTo(x - 15, by - 3); ctx.lineTo(x + 15, by - 3); ctx.lineTo(x + 10, by - 38); ctx.lineTo(x - 10, by - 38); ctx.fill();
  // 팔 (걸을 때 앞뒤로 흔들림)
  ctx.strokeStyle = '#20263f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - 11, by - 33); ctx.lineTo(x - 15, by - 16 + step * 3); ctx.moveTo(x + 11, by - 33); ctx.lineTo(x + 15, by - 16 - step * 3); ctx.stroke();
  ctx.fillStyle = '#e8d6c0'; ctx.beginPath(); ctx.arc(x - 15, by - 14 + step * 3, 2.5, 0, 7); ctx.arc(x + 15, by - 14 - step * 3, 2.5, 0, 7); ctx.fill();
  if (view === 'front') {
    ctx.fillStyle = '#e9e4d8'; ctx.beginPath(); ctx.moveTo(x - 7, by - 38); ctx.lineTo(x, by - 28); ctx.lineTo(x + 7, by - 38); ctx.lineTo(x + 4, by - 38); ctx.lineTo(x, by - 32); ctx.lineTo(x - 4, by - 38); ctx.fill();   // 깃
    ctx.fillRect(x - 11, by - 26, 22, 3);   // 고름
    ctx.fillStyle = '#e9e4d8'; ctx.fillRect(x + 1, by - 24, 2, 9);
    ctx.fillStyle = '#e8d6c0'; ctx.beginPath(); ctx.arc(x, by - 46, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(x - 4, by - 47, 2, 2); ctx.fillRect(x + 2, by - 47, 2, 2);
    ctx.fillStyle = '#b08a78'; ctx.fillRect(x - 1.5, by - 42, 3, 1);
  } else {
    ctx.strokeStyle = '#3a4266'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, by - 38); ctx.lineTo(x, by - 4); ctx.stroke();   // 등 솔기
    ctx.fillStyle = '#e9e4d8'; ctx.fillRect(x - 11, by - 26, 22, 3);
    ctx.fillStyle = '#e8d6c0'; ctx.fillRect(x - 3, by - 40, 6, 3);                         // 목덜미
    ctx.fillStyle = '#16161c'; ctx.beginPath(); ctx.arc(x, by - 46, 9.3, 0, 7); ctx.fill();   // 뒷머리 (얼굴이 안 보임)
  }
  // 갓
  ctx.fillStyle = 'rgba(15,15,20,0.92)';
  ctx.beginPath(); ctx.ellipse(x, by - 52, 18, 4, 0, 0, 7); ctx.fill();
  ctx.fillRect(x - 6, by - 65, 12, 13);
}

// --- 마을 지도 (왼쪽 아래) ---
function drawMinimap() {
  const mw = 150, mh = Math.round(mw * AH / AW), mx = 16, my = H - mh - 16, s = mw / AW;
  ctx.fillStyle = 'rgba(4,14,16,0.82)'; ctx.fillRect(mx - 4, my - 18, mw + 8, mh + 22);
  ctx.strokeStyle = 'rgba(120,230,215,0.4)'; ctx.lineWidth = 1; ctx.strokeRect(mx - 3.5, my - 17.5, mw + 7, mh + 21);
  ctx.fillStyle = '#7fbfb6'; ctx.font = `11px ${FONT}`; ctx.textAlign = 'left'; ctx.fillText('마을 지도', mx, my - 5);
  ctx.fillStyle = '#0b3a3d'; ctx.fillRect(mx, my + 150 * s, mw, 50 * s);                                  // 강
  ctx.fillStyle = 'rgba(120,150,140,0.5)'; ctx.fillRect(mx, my + 225 * s, mw, 30 * s);                     // 강가 건물 줄
  for (const r of OBST) { ctx.fillStyle = 'rgba(120,150,140,0.5)'; ctx.fillRect(mx + r.x0 * s, my + (r.y0 - 40) * s, (r.x1 - r.x0) * s, (r.y1 - r.y0 + 40) * s); }
  const dot = (x, y, c, r = 2) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(mx + x * s, my + y * s, r, 0, 7); ctx.fill(); };
  for (const c of CITIZENS) dot(c.x, c.y, 'rgba(200,220,215,0.6)', 1.3);
  dot(NPCS[0].x, NPCS[0].y, '#ff6b6b', 2.6); dot(NPCS[1].x, NPCS[1].y, '#4fd1c5', 2.6); dot(NPCS[2].x, NPCS[2].y, '#ffa94d', 2.6);
  dot(PORTAL.x, PORTAL.y, '#ffcf9a', 2.6);
  for (const d of MINIS) dot(d.x, d.y, miniLocked(d) ? '#6c6880' : '#ffd43b', 2.2);   // 미니게임
  if (Math.floor(time * 3) % 2) dot(AP.x, AP.y, '#ffffff', 3);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.strokeRect(mx + acam * s, my + acamY * s, W * s, H * s);   // 지금 보이는 곳
}

function drawAfterlife() {
  glows = []; lights = [];
  ctx.fillStyle = '#0a1f21'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(0, -acamY);   // 위아래로 움직이는 카메라
  drawVillageBack();
  // 건물·우물·시민·NPC·나를 앞뒤(y) 순서대로
  const near = talking || chat ? null : nearAfter();
  const list = [{ y: 345, f: () => { if (1620 - acam > -60 && 1620 - acam < W + 60) drawWell(1620 - acam, 345); } }];
  for (const o of VOBJ) list.push({ y: o.b, f: () => drawVObj(o) });
  for (const l of ROW_LAMPS) list.push({ y: l.y, f: () => drawRowLamp(l) });
  for (const n of NPCS) list.push({ y: n.y, f: () => {
    const x = n.x - acam, on = near === n.id || talking === n.id;
    if (x < -80 || x > W + 80 || n.y - 140 > acamY + H || n.y < acamY - 20) return;
    shadow(x, n.y, 22);
    if (on) warmGlow(x, n.y - 40, 90, '120,255,230', 0.22);
    ctx.save(); ctx.translate(x, n.y); ctx.scale(1.3, 1.3); drawNpc(n.id); ctx.restore();
    // 이름표 (건물 벽 위에서도 읽히게 어두운 바탕)
    const label = `${n.name} · ${n.job}`;
    ctx.font = `${on ? 'bold ' : ''}13px ${FONT}`; const lw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(4,14,16,0.8)'; ctx.fillRect(x - lw / 2 - 7, n.y - 133, lw + 14, 20);
    ctx.textAlign = 'center'; ctx.fillStyle = on ? '#bff' : '#8cc';
    ctx.fillText(label, x, n.y - 118);
  } });
  for (const c of CITIZENS) list.push({ y: c.y, f: () => drawCitizen(c) });
  list.push({ y: AP.y, f: () => drawPlayer(AP.x - acam, AP.y, AP.view) });
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  drawMiniDoors(near);
  // 가까이 있는 상대 안내 (미니게임 문은 drawMiniDoors 에서)
  if (near && !near.fee) {
    let tx, ty, text, col = '#9ef0e4';
    if (near === 'portal') { tx = PORTAL.x; ty = PORTAL.y + 26; text = bossDone ? '[F] 저승길로 (엔드리스)' : '[F] 이승으로 돌아가기'; col = '#ffcf9a'; }
    else if (typeof near === 'string') { const n = NPCS.find(o => o.id === near); tx = n.x; ty = n.y + 26; text = '[F] 말 걸기'; }
    else { tx = near.x; ty = near.y + 24; text = `${near.name} · [F] 말 걸기`; }
    ctx.textAlign = 'center'; ctx.font = `bold 15px ${FONT}`;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 4); ctx.fillStyle = col;
    ctx.fillText(text, tx - acam, ty); ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (chat) drawChatBox();
  else drawMinimap();
  // 포인트와 조작 안내
  ctx.fillStyle = 'rgba(4,14,16,0.6)'; ctx.fillRect(10, 10, 630, 24);
  ctx.textAlign = 'right'; ctx.font = `bold 14px ${FONT}`;
  let yy = 26;
  for (const k of ['soul', 'tear', 'grudge']) { ctx.fillStyle = PT_COLORS[k]; ctx.fillText(`${PT_NAMES[k]} ${pts[k]}`, W - 20, yy); yy += 20; }
  ctx.textAlign = 'left'; ctx.font = `12px ${FONT}`; ctx.fillStyle = '#7fbfb6';
  ctx.fillText('WASD 이동 · 누구에게나 다가가서 F 로 말 걸기 · R 이승으로 가는 문 앞으로 바로 이동 · Esc 설정', 20, 26);
  // 문 앞으로 이동할 때 잠깐 어두워짐
  if (warp > 0) {
    const k = 1 - Math.abs(warp - WARP_T / 2) / (WARP_T / 2);
    ctx.fillStyle = `rgba(2,8,10,${k})`; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = k; ctx.textAlign = 'center'; ctx.font = `bold 16px ${FONT}`; ctx.fillStyle = '#ffcf9a';
    ctx.fillText('이승으로 가는 문으로…', W / 2, H / 2); ctx.globalAlpha = 1;
  }
  drawMsgs();
}

// ===== 반복 =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  if (state === 'mini') { if (!menu && !devMenu) updateMini(dt); drawMini(); }
  else if (state === 'afterlife') { if (!menu && !devMenu) updateAfterlife(dt); drawAfterlife(); }
  else {
    drawWorld();
    if (state === 'play' || state === 'dead') drawHUD();
    if (state === 'title') drawTitle();
    if (state === 'howto') drawHowto();
    if (state === 'dead') drawDead();
    if (state === 'ending') drawEnding();
    drawMsgs();
  }
  if (menu) drawMenu();
  if (devMenu) drawDevMenu();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
