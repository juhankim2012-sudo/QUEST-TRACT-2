<meta charset="utf-8">
<title>저승길 퇴마록</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#ddd;user-select:none}
  #wrap{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:center}
  canvas{display:block;cursor:crosshair}
  #after{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(#0a1a1fdd,#05100fee);border-top:1px solid #4fd1c566;padding:10px 16px;box-sizing:border-box;font-size:14px}
  #after.hide{display:none}
  #after .top{display:flex;align-items:center;gap:12px}
  #after h2{margin:0;font-size:17px;color:#9ef0e4;font-weight:600}
  #aPts{flex:1;text-align:right}
  .c-soul{color:#ffa94d}.c-tear{color:#74c0fc}.c-grudge{color:#d0a2ff}
  #after button{font:inherit;background:#123033;color:#cfeee9;border:1px solid #4fd1c588;border-radius:6px;padding:4px 10px;cursor:pointer}
  #after button:hover:not(:disabled){background:#1b4a4e}
  #after button:disabled{opacity:.35;cursor:default}
  #after button.on{background:#2a6b66;color:#fff}
  #line{font-style:italic;color:#bfe;margin:4px 0 8px;min-height:20px}
  #list{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:170px;overflow:auto}
  .item{background:#0d2427;border:1px solid #2b5a5a;border-radius:8px;padding:6px 8px}
  .item b{color:#e6fffb}.item small{color:#8bb;display:block;margin:2px 0 4px}
  .item .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
</style>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="after" class="hide">
    <div class="top"><h2 id="npcName">저승사자</h2><div id="aPts"></div><button id="back">대화 끝내기 (F / Esc)</button></div>
    <div id="line"></div>
    <div id="list"></div>
  </div>
</div>
<script>
// ===== 기본 설정 =====
const W = 960, H = 540, ROAD_TOP = 250, ROAD_BOT = 520;
const SAVE_GAP = 2400, SAVE_W = 320;          // 세이브 포인트 간격과 폭
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dk = document.createElement('canvas'); dk.width = W; dk.height = H;
const dctx = dk.getContext('2d');
const wrap = document.getElementById('wrap');
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); wrap.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
const FONT = '"Malgun Gothic","Apple SD Gothic Neo",sans-serif';

// ===== 포인트 =====
const PT_NAMES = { soul: '혼불', tear: '망자의 눈물', grudge: '원념 조각' };
const PT_COLORS = { soul: '#ffa94d', tear: '#74c0fc', grudge: '#d0a2ff' };

// ===== 무기 (저승사자에게 삼) =====
const WEAPONS = {
  dagger:   { name: '은장도',   type: 'melee', dmg: 10, range: 72,  arc: 1.9, cd: 0.28, cost: 2, kb: 70,  price: null, desc: '가볍고 빠른 근접 무기' },
  talisman: { name: '퇴마 부적', type: 'shot',  dmg: 9,  speed: 560, cd: 0.32, cost: 3, pierce: 1, price: { soul: 40 }, desc: '마우스 쪽으로 부적을 던짐 (2마리 관통)' },
  vajra:    { name: '금강저',   type: 'melee', dmg: 24, range: 115, arc: 2.8, cd: 0.65, cost: 7, kb: 190, price: { soul: 110, grudge: 1 }, desc: '넓고 강하게 휘두름' },
  bell:     { name: '신령 방울', type: 'ring',  dmg: 14, range: 135, cd: 0.85, cost: 8, kb: 130, price: { soul: 150, tear: 4 }, desc: '내 주변 전체에 퇴마의 울림' },
};
const W_ORDER = ['dagger', 'talisman', 'vajra', 'bell'];

// ===== 스킬 (사서에게 배움) =====
const SKILLS = {
  light:   { name: '정화의 빛',   cd: 6,  cost: 20, price: { tear: 5 }, desc: '마우스 쪽으로 긴 빛줄기' },
  barrier: { name: '결계',       cd: 12, cost: 25, price: { tear: 8 }, desc: '3초 동안 피해를 막고 몬스터를 밀어냄' },
  scream:  { name: '원한의 비명', cd: 10, cost: 30, price: { tear: 6 }, need: 'hair', desc: '주변 몬스터에게 피해 + 느려짐 (원귀의 기술)' },
  charge:  { name: '망령 돌진',   cd: 7,  cost: 20, price: { tear: 6 }, need: 'helm', desc: '마우스 쪽으로 돌진하며 벰 (해골 기사의 기술)' },
};
const UNIQUES = { hair: { name: '원귀의 머리카락', from: '원귀' }, helm: { name: '해골 기사의 투구', from: '해골 기사' } };

// ===== 몬스터 =====
const MON = {
  zombie:   { name: '좀비',       hp: 30,  speed: 42, dmg: 9,  r: 18, ghost: false, drop: { soul: 2 } },
  skeleton: { name: '해골 병사',   hp: 24,  speed: 72, dmg: 7,  r: 16, ghost: false, drop: { soul: 3 } },
  wisp:     { name: '떠도는 혼령', hp: 20,  speed: 62, dmg: 7,  r: 16, ghost: true,  drop: { soul: 3 }, extra: [['tear', 0.35, 1]] },
  shade:    { name: '그림자 귀신', hp: 38,  speed: 90, dmg: 12, r: 18, ghost: true,  drop: { soul: 6, tear: 1 }, extra: [['grudge', 0.15, 1]] },
  wongwi:   { name: '원귀',       hp: 300, speed: 58, dmg: 16, r: 24, ghost: true,  elite: true, drop: { soul: 40, tear: 6, grudge: 4 }, unique: 'hair' },
  knight:   { name: '해골 기사',   hp: 380, speed: 50, dmg: 20, r: 26, ghost: false, elite: true, drop: { soul: 50, tear: 4, grudge: 5 }, unique: 'helm' },
};
// 공격 동작: trigger 이 거리 안에 들어오면 준비 시작, reach 맞는 거리, wind 준비 시간, hit 공격 시간, rec 숨 고르기, cd 다음 공격까지
MON.zombie.atk   = { kind: 'swipe', trigger: 46,  reach: 60,  wind: 0.55, hit: 0.15, rec: 0.45, cd: 0.9 };
MON.skeleton.atk = { kind: 'stab',  trigger: 52,  reach: 68,  wind: 0.35, hit: 0.12, rec: 0.35, cd: 0.8, lunge: 16 };
MON.wisp.atk     = { kind: 'lunge', trigger: 120, wind: 0.5,  hit: 0.3,  rec: 0.5,  cd: 1.2, lungeSpd: 420 };
MON.shade.atk    = { kind: 'swipe', trigger: 76,  reach: 90,  wind: 0.4,  hit: 0.15, rec: 0.4,  cd: 0.9 };
MON.wongwi.atk   = { kind: 'swipe', trigger: 72,  reach: 88,  wind: 0.6,  hit: 0.18, rec: 0.5,  cd: 1.0 };
MON.knight.atk   = { kind: 'swipe', trigger: 82,  reach: 104, wind: 0.6,  hit: 0.2,  rec: 0.6,  cd: 1.0 };
const ELITE_ORDER = ['wongwi', 'knight'];

// ===== 게임 상태 =====
let state = 'title';
let time = 0;
const cam = { x: 0 };
let P, pts, owned, weapon, wlv, learned, slots, skillCd, uniques, up;
let mons, shots, effects, parts, texts, msgs;
let spawnT, nextElite, eliteIdx, lastSave, hurtFlash, beat;
let drops, natT;   // 바닥에 떨어진 포인트, 저절로 생기는 포인트 타이머

function newGame() {
  P = { x: 140, y: 390, hp: 100, maxHp: 100, sp: 100, maxSp: 100, spRegen: 9, speed: 210,
        inv: 0, slow: 0, shield: 0, dash: null, kx: 0, ky: 0, walk: 0, moving: false };
  pts = { soul: 0, tear: 0, grudge: 0 };
  owned = { dagger: true }; weapon = 'dagger';
  wlv = { dagger: 0, talisman: 0, vajra: 0, bell: 0 };
  learned = {}; slots = [null, null]; skillCd = {}; uniques = {}; up = { hp: 0, sp: 0 };
  mons = []; shots = []; effects = []; parts = []; texts = []; msgs = [];
  spawnT = 1.5; nextElite = 4200; eliteIdx = 0; lastSave = 0; hurtFlash = 0; beat = 0;
  drops = []; natT = 4;
  cam.x = 0;
}
newGame();

// ===== 입력 =====
const keys = {};
const mouse = { x: W / 2, y: H / 2, down: false };
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  onKey(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) / r.width * W;
  mouse.y = (e.clientY - r.top) / r.height * H;
}
cv.addEventListener('mousemove', toCanvas);
cv.addEventListener('mousedown', e => {
  toCanvas(e); initAudio();
  if (state === 'title') { newGame(); state = 'play'; msg('저승길이 열렸다…', 2.5); return; }
  if (state === 'dead') { respawn(); return; }
  if (state !== 'play') return;
  if (e.button === 0) mouse.down = true;
  if (e.button === 2) castSlot(0);
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());

function onKey(code) {
  if (code === 'KeyM') toggleMute();
  if (state === 'afterlife') {
    if (talking) { if (code === 'Escape' || code === 'KeyF') closeTalk(); return; }
    if (code === 'KeyF') { const n = nearAfter(); if (n === 'portal') leaveAfterlife(); else if (n) openTalk(n); }
    return;
  }
  if (state !== 'play') return;
  const n = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(code);
  if (n >= 0 && owned[W_ORDER[n]]) weapon = W_ORDER[n];
  if (code === 'Space') castSlot(1);
  if (code === 'KeyF' && zoneAt(P.x)) enterAfterlife();
}

// ===== 소리 (처음 클릭할 때 켜짐, M 으로 끄기) =====
let AC = null, master = null, muted = false;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    [55, 55.6, 82.4].forEach(f => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.value = 0.045;
      o.connect(g); g.connect(master); o.start();
    });
    const buf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 0.8;
    const lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = 250; lfo.connect(lg); lg.connect(bp.frequency); lfo.start();
    const wg = AC.createGain(); wg.gain.value = 0.05;
    src.connect(bp); bp.connect(wg); wg.connect(master); src.start();
  } catch (e) { AC = null; }
}
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; msg(muted ? '소리 끔' : '소리 켬', 1); }
function sfx(f, dur = 0.12, type = 'triangle', vol = 0.12, f2) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}

// ===== 도우미 =====
function msg(text, dur = 2, color = '#e8ddff') { msgs.push({ text, t: dur, max: dur, color }); if (msgs.length > 3) msgs.shift(); }
function floatText(x, y, text, color, size = 14) { texts.push({ x, y, text, color, size, t: 1.1 }); }
function zoneAt(x) {
  const i = Math.floor(x / SAVE_GAP);
  if (i < 1) return 0;
  const sx = i * SAVE_GAP;
  return (x >= sx && x <= sx + SAVE_W) ? i : 0;
}
function inZoneWide(x, pad) {
  const i = Math.floor((x + pad) / SAVE_GAP);
  if (i < 1) return 0;
  const sx = i * SAVE_GAP;
  return (x >= sx - pad && x <= sx + SAVE_W + pad) ? i : 0;
}
const pcx = () => P.x, pcy = () => P.y - 28;
const mcx = m => m.x, mcy = m => m.y - m.r * 1.2 - (m.hover || 0);
function aimAngle() { return Math.atan2(mouse.y - pcy(), mouse.x + cam.x - pcx()); }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return Math.abs(d); }
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function burst(x, y, color, n = 8, spd = 120, glow = false) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, t: 0.5 + Math.random() * 0.5, max: 1, color, size: 2 + Math.random() * 3, glow });
  }
}
const ghostWeak = () => P.sp < P.maxSp * 0.25;

// ===== 몬스터 생성 =====
function spawnMonster(type, x, y) {
  const d = MON[type], hpMul = 1 + P.x / 9000;
  const m = { type, x, y, hp: d.hp * hpMul, maxHp: d.hp * hpMul, speed: d.speed, dmg: d.dmg * (1 + P.x / 15000),
              r: d.r, ghost: d.ghost, elite: !!d.elite, vx: 0, vy: 0, t: 0, slow: 0, flash: 0,
              fade: d.ghost ? 0 : 1, seed: Math.random(), hover: 0 };
  mons.push(m);
  return m;
}
function pickType() {
  const d = P.x, pool = [['zombie', 5]];
  if (d > 500) pool.push(['skeleton', 4]);
  if (d > 1100) pool.push(['wisp', 4]);
  if (d > 3000) pool.push(['shade', 2 + Math.min(4, d / 3000)]);
  let sum = pool.reduce((s, p) => s + p[1], 0), r = Math.random() * sum;
  for (const [t, w] of pool) { r -= w; if (r <= 0) return t; }
  return 'zombie';
}
function trySpawn() {
  if (mons.length > 45) return;
  const count = 1 + Math.floor(Math.random() * (1 + P.x / 5000));
  for (let k = 0; k < count; k++) {
    const type = pickType();
    let x, y = ROAD_TOP + 20 + Math.random() * (ROAD_BOT - ROAD_TOP - 20);
    if (MON[type].ghost && Math.random() < 0.4) {
      // 귀신은 어둠 속에서 스르르 나타난다 (내 근처는 피함)
      x = cam.x + 60 + Math.random() * (W - 120);
      if (Math.abs(x - P.x) < 260) x += x < P.x ? -260 : 260;
    } else {
      x = Math.random() < 0.78 ? cam.x + W + 40 + Math.random() * 80 : cam.x - 40;
    }
    if (x < 300 || inZoneWide(x, 40)) continue;
    spawnMonster(type, x, y);
  }
}
function spawnElite() {
  const type = ELITE_ORDER[eliteIdx % ELITE_ORDER.length];
  let x = cam.x + W + 60;
  if (inZoneWide(x, 60)) { nextElite = P.x + 600; return; }
  eliteIdx++;
  nextElite += 3500;
  spawnMonster(type, x, (ROAD_TOP + ROAD_BOT) / 2);
  msg(type === 'wongwi' ? '공기가 갑자기 차가워진다…' : '무거운 갑옷 소리가 다가온다…', 3.5, '#ff9aa8');
}

// ===== 공격 =====
function weaponDmg(id) { return WEAPONS[id].dmg * (1 + 0.25 * wlv[id]); }
function attack() {
  const w = WEAPONS[weapon];
  if (P.atkCd > 0 || P.dash) return;
  P.atkCd = w.cd;
  P.sp = Math.max(0, P.sp - w.cost);
  const a = aimAngle(), dmg = weaponDmg(weapon), x = pcx(), y = pcy();
  if (w.type === 'melee') {
    effects.push({ kind: 'slash', x, y, ang: a, range: w.range, arc: w.arc, t: 0.16, max: 0.16, big: weapon === 'vajra' });
    for (const m of mons) {
      if (m.dead || m.fade < 0.3) continue;
      const mx = mcx(m), my = mcy(m), d = Math.hypot(mx - x, my - y);
      if (d < w.range + m.r && angDiff(Math.atan2(my - y, mx - x), a) <= w.arc / 2) hurt(m, dmg, Math.cos(a), Math.sin(a), w.kb);
    }
    sfx(weapon === 'vajra' ? 180 : 420, 0.09, 'sawtooth', 0.05, 120);
  } else if (w.type === 'shot') {
    shots.push({ x, y, vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed, dmg, pierce: w.pierce, hit: new Set(), t: 1.2, ang: a });
    sfx(700, 0.08, 'square', 0.04, 300);
  } else if (w.type === 'ring') {
    effects.push({ kind: 'ring', x, y, r: w.range, t: 0.35, max: 0.35, color: '255,220,140' });
    for (const m of mons) {
      if (m.dead || m.fade < 0.3) continue;
      const mx = mcx(m), my = mcy(m), d = Math.hypot(mx - x, my - y);
      if (d < w.range + m.r) hurt(m, dmg, (mx - x) / (d || 1), (my - y) / (d || 1), w.kb);
    }
    sfx(1200, 0.4, 'sine', 0.08, 900);
  }
}
let weakHintT = 0;
function hurt(m, base, nx, ny, kb) {
  let dmg = base;
  if (m.ghost && ghostWeak()) {
    dmg *= 0.2;
    if (weakHintT <= 0) { floatText(mcx(m), mcy(m) - 30, '영력 부족!', '#b197fc', 13); weakHintT = 1.2; }
  }
  m.hp -= dmg; m.flash = 0.12;
  // 세게 맞으면 작은 몬스터는 공격 준비가 끊긴다
  if (!m.elite && m.atk && m.atk.phase === 'wind' && kb >= 120) { m.atk = null; m.acd = 0.6; }
  const k = m.elite ? 0.2 : 1;
  m.vx += nx * kb * k; m.vy += ny * kb * k * 0.6;
  floatText(mcx(m) + (Math.random() * 16 - 8), mcy(m) - 20, Math.round(dmg), dmg < base ? '#9a8fb8' : '#fff', 12);
  burst(mcx(m), mcy(m), m.ghost ? '#bde0ff' : '#cfc6b0', 4, 90, m.ghost);
  if (m.hp <= 0) kill(m);
}
// ===== 떨어진 포인트 =====
// 어둠 속에서 멀리 있는 몬스터의 눈빛과 똑같이 생겼다 (색, 크기, 눈 사이 거리, 높이, 깜빡임까지)
//   혼불 = 좀비 눈 · 망자의 눈물 = 그림자 귀신 눈 · 원념 조각 = 해골 병사 눈
const DROP_EYE = { soul: ['230,230,150', 1.8, 5], tear: ['255,255,255', 2, 8], grudge: ['255,70,60', 1.4, 6] };
function dropPoint(type, amt, x, y) {
  if (amt <= 0) return;
  y = clamp(y, ROAD_TOP + 14, ROAD_BOT);
  drops.push({ type, amt, hx: x, hy: y, x, y, seed: Math.random(), t: 0, life: 120 });
}
function updateDrops(dt) {
  for (const d of drops) {
    d.t += dt; d.life -= dt;
    // 제자리에서 조금씩 두리번거리듯 움직임
    d.x = d.hx + Math.sin(d.t * 0.6 + d.seed * 10) * 10 + Math.sin(d.t * 1.7 + d.seed * 3) * 3;
    d.y = d.hy + Math.sin(d.t * 0.45 + d.seed * 5) * 6;
    if (Math.hypot(P.x - d.x, P.y - d.y) < 34) {
      d.life = 0;
      pts[d.type] += d.amt;
      floatText(d.x, d.y - 60, `+${d.amt} ${PT_NAMES[d.type]}`, PT_COLORS[d.type], 13);
      sfx(d.type === 'soul' ? 660 : d.type === 'tear' ? 990 : 330, 0.15, 'sine', 0.07, d.type === 'grudge' ? 220 : 1320);
    }
  }
  drops = drops.filter(d => d.life > 0);
}
// 눈 깜빡임 (몬스터와 포인트가 똑같이 깜빡인다)
const blinking = seed => ((time * 0.4 + seed * 13) % 3.5) < 0.13;
function eyeGlow(list, rgb, r, al) {
  for (const [ex, ey] of list) {
    const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 5);
    g.addColorStop(0, `rgba(${rgb},${0.9 * al})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(ex - r * 5, ey - r * 5, r * 10, r * 10);
    ctx.fillStyle = `rgba(255,255,255,${0.9 * al})`; ctx.beginPath(); ctx.arc(ex, ey, r * 0.6, 0, 7); ctx.fill();
  }
}
function drawDrops() {
  for (const d of drops) {
    if (blinking(d.seed)) continue;
    const [rgb, r, gap] = DROP_EYE[d.type];
    const x = d.x - cam.x, y = d.y - 46 + Math.sin(d.t * 1.3 + d.seed * 7) * 2;
    const look = Math.sin(d.t * 0.5 + d.seed * 20) > 0 ? 1 : -1;   // 가끔 고개를 돌리듯 눈 위치가 바뀜
    const al = Math.min(1, d.life / 3);
    // 가까이 가도, 밝은 곳에서도 처음부터 끝까지 멀리서 보이는 몬스터 눈빛 모습 그대로
    glows.push(() => eyeGlow([[x + look * 2 - gap / 2, y], [x + look * 2 + gap / 2, y]], rgb, r, al));
  }
}

function kill(m) {
  if (m.dead) return;
  m.dead = true;
  const d = MON[m.type];
  const got = { ...d.drop };
  for (const [k, ch, n] of d.extra || []) if (Math.random() < ch) got[k] = (got[k] || 0) + n;
  if (d.unique) {
    if (!uniques[d.unique]) {
      uniques[d.unique] = true;
      msg(`특이 포인트: 「${UNIQUES[d.unique].name}」 획득! 사후세계 사서에게 기술을 배울 수 있다`, 4.5, '#ffd43b');
    } else got.grudge = (got.grudge || 0) + 2;
  }
  // 포인트는 바닥에 떨어지고, 직접 가서 주워야 한다 (혼불은 최대 3덩이로 나뉨)
  for (const k in got) {
    const n = k === 'soul' ? Math.min(3, got[k]) : 1;
    for (let i = 0; i < n; i++) {
      const amt = Math.floor(got[k] / n) + (i < got[k] % n ? 1 : 0);
      dropPoint(k, amt, m.x + (Math.random() - 0.5) * 70, m.y + (Math.random() - 0.5) * 50);
    }
  }
  burst(mcx(m), mcy(m), m.ghost ? '#cfe8ff' : '#a89f8c', m.elite ? 40 : 14, m.elite ? 220 : 130, m.ghost);
  if (m.ghost) for (let i = 0; i < 6; i++) parts.push({ x: mcx(m) + Math.random() * 20 - 10, y: mcy(m), vx: Math.random() * 20 - 10, vy: -40 - Math.random() * 60, t: 1.2, max: 1.2, color: '#e7f5ff', size: 3, glow: true });
  sfx(m.ghost ? 900 : 160, m.elite ? 0.8 : 0.25, 'sine', 0.1, m.ghost ? 200 : 60);
}

function castSlot(i) {
  const id = slots[i];
  if (!id) { msg(i === 0 ? '우클릭에 설정한 스킬이 없다 (사후세계 사서)' : '스페이스에 설정한 스킬이 없다 (사후세계 사서)', 1.6); return; }
  const s = SKILLS[id];
  if ((skillCd[id] || 0) > 0) return;
  if (P.sp < s.cost) { msg('영력이 부족하다', 1.2, '#b197fc'); return; }
  P.sp -= s.cost; skillCd[id] = s.cd;
  const a = aimAngle(), x = pcx(), y = pcy();
  if (id === 'light') {
    const len = 620, bx = x + Math.cos(a) * len, by = y + Math.sin(a) * len;
    effects.push({ kind: 'beam', x, y, ang: a, len, t: 0.35, max: 0.35 });
    for (const m of mons) if (!m.dead && m.fade > 0.3 && segDist(mcx(m), mcy(m), x, y, bx, by) < m.r + 14) hurt(m, 45, Math.cos(a), Math.sin(a), 120);
    sfx(1500, 0.5, 'sine', 0.1, 600);
  } else if (id === 'barrier') {

    effects.push({ kind: 'ring', x, y, r: 210, t: 0.6, max: 0.6, color: '255,120,140' });
    for (const m of mons) {
      if (m.dead || m.fade < 0.3) continue;
      const d = Math.hypot(mcx(m) - x, mcy(m) - y);
      if (d < 210 + m.r) { m.slow = 2.5; hurt(m, 32, (mcx(m) - x) / (d || 1), (mcy(m) - y) / (d || 1), 80); }
    }
    sfx(300, 0.7, 'sawtooth', 0.06, 1400);
  } else if (id === 'charge') {
    P.dash = { vx: Math.cos(a) * 900, vy: Math.sin(a) * 900 * 0.7, t: 0.25, hit: new Set() };
    sfx(120, 0.3, 'sawtooth', 0.08, 60);
  }
}

// ===== 업데이트 =====
function update(dt) {
  time += dt;
  msgs.forEach(m => m.t -= dt); msgs = msgs.filter(m => m.t > 0);
  if (state === 'title') {
    P.x += 70 * dt; P.moving = true; P.walk += dt; cam.x = P.x - W * 0.38;
    return;
  }
  if (state !== 'play') return;

  P.atkCd -= dt; P.inv -= dt; P.slow -= dt; P.shield -= dt; hurtFlash -= dt; weakHintT -= dt;
  for (const k in skillCd) skillCd[k] -= dt;

  // 움직이기
  if (P.dash) {
    P.x += P.dash.vx * dt; P.y += P.dash.vy * dt; P.dash.t -= dt;
    for (const m of mons) if (!m.dead && !P.dash.hit.has(m) && Math.hypot(mcx(m) - pcx(), mcy(m) - pcy()) < m.r + 30) {
      P.dash.hit.add(m); hurt(m, 38, P.dash.vx / 900, P.dash.vy / 900, 150);
    }
    effects.push({ kind: 'after', x: P.x, y: P.y, t: 0.25, max: 0.25 });
    if (P.dash.t <= 0) P.dash = null;
  } else {
    let mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), my = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    const len = Math.hypot(mx, my);
    P.moving = len > 0;
    if (len) { mx /= len; my /= len; P.walk += dt; }
    const sp = P.speed * (P.slow > 0 ? 0.55 : 1);
    P.x += mx * sp * dt + P.kx * dt; P.y += my * sp * 0.8 * dt + P.ky * dt;
  }
  const fr = Math.pow(0.002, dt); P.kx *= fr; P.ky *= fr;
  P.y = clamp(P.y, ROAD_TOP + 12, ROAD_BOT);
  // 뒤쪽에 몬스터가 남아 있으면 뒤로 돌아갈 수 있고 카메라도 따라온다
  const backOK = mons.some(m => !m.dead && m.x < P.x && P.x - m.x < 1600);
  P.x = Math.max(P.x, backOK ? 20 : cam.x + 20);

  // 세이브 포인트
  const z = zoneAt(P.x);
  if (z) {
    if (z > lastSave) {
      lastSave = z;
      // 세이브 포인트에 처음 왔을 때 한 번만, 비어 있는 체력의 2/3 만 채운다 (다 차면 피할 생각을 안 하게 돼서)
      const heal = Math.round((P.maxHp - P.hp) * 2 / 3);
      P.hp = Math.min(P.maxHp, P.hp + heal);
      msg(`세이브 포인트 · 저승 등불 ${z}번째`, 2.5, '#9ef0e4');
      if (heal > 0) floatText(P.x, P.y - 70, `체력 +${heal}`, '#ff8a9a', 15);
      sfx(520, 0.8, 'sine', 0.08, 780);
    }
  }
  P.sp = Math.min(P.maxSp, P.sp + P.spRegen * (z ? 3 : 1) * dt);
  if (backOK && P.x - cam.x < W * 0.3) cam.x = Math.max(0, P.x - W * 0.3);
  cam.x = Math.max(cam.x, P.x - W * 0.38);

  if (mouse.down) attack();

  // 몬스터 나오기
  if (!z) {
    spawnT -= dt;
    if (spawnT <= 0) { spawnT = Math.max(0.55, 2.4 - P.x / 3000) * (0.7 + Math.random() * 0.6); trySpawn(); }
    if (P.x > nextElite) spawnElite();
  }

  // 몬스터 움직임
  let eliteAlive = false;
  for (const m of mons) {
    if (m.dead) continue;
    if (m.elite) eliteAlive = true;
    m.t += dt; m.flash -= dt; m.slow -= dt;
    if (m.fade < 1 && m.vanish == null) m.fade = Math.min(1, m.fade + dt * 0.9);
    const dx = P.x - m.x, dy = P.y - m.y, d = Math.hypot(dx, dy) || 1;
    const sp = m.speed * (m.slow > 0 ? 0.45 : 1);
    let vx = dx / d * sp, vy = dy / d * sp;
    if (m.ghost) m.hover = 14 + Math.sin(m.t * 2 + m.seed * 9) * 6;
    m.acd = (m.acd ?? 0.5) - dt;
    if (z) {
      // 내가 세이브 포인트 안에 있으면 몬스터는 쫓아오지 않고 길 전체로 퍼져서 제멋대로 떠돈다
      if (m.vanish != null) m.vanish = null;
      if (m.type === 'knight') { m.cs = 'walk'; m.ct = 3; }
      m.atk = null;
      if (m.wseg !== z) {
        // 오른쪽 몬스터는 이번 등불~다음 등불 사이, 왼쪽 몬스터는 지나온 길에 퍼진다
        const sx = z * SAVE_GAP;
        if (m.x >= sx + SAVE_W / 2) { m.wa = sx + SAVE_W + 50; m.wb = (z + 1) * SAVE_GAP - 50; }
        else { m.wa = (z - 1) * SAVE_GAP + (z > 1 ? SAVE_W : 0) + 50; m.wb = sx - 50; }
        m.wseg = z;
        m.wx = m.wa + Math.random() * (m.wb - m.wa);
        m.wy = ROAD_TOP + 20 + Math.random() * (ROAD_BOT - ROAD_TOP - 20);
        m.wt = Math.abs(m.wx - m.x) / (m.speed * 0.7) + 1;
      }
      m.wt -= dt;
      if (m.wt <= 0) {
        m.wx = clamp(m.x + (Math.random() - 0.5) * 500, m.wa, m.wb);
        m.wy = ROAD_TOP + 20 + Math.random() * (ROAD_BOT - ROAD_TOP - 20);
        m.wt = 3 + Math.random() * 3;
      }
      const wdx = m.wx - m.x, wdy = m.wy - m.y, wd = Math.hypot(wdx, wdy) || 1;
      const ws = wd < 8 ? 0 : m.speed * 0.7;
      vx = wdx / wd * ws; vy = wdy / wd * ws;
    } else m.wseg = null;
    if (m.type === 'wisp' && !m.atk) vy += Math.sin(m.t * 3 + m.seed * 6) * 50;
    if (z) { /* 떠도는 중에는 특수 행동 없음 */ }
    else if (m.type === 'shade') {
      m.st = (m.st ?? 1) - dt;
      if (m.st <= 0) { m.dashing = !m.dashing; m.st = m.dashing ? 0.5 : 1.1; }
      const f = m.dashing ? 2.6 : 0.35; vx *= f; vy *= f;
    }
    if (m.type === 'wongwi' && !z) {
      // 사라졌다가 내 근처에 다시 나타남 (천천히)
      m.tp = (m.tp ?? 4) - dt;
      if (m.tp <= 0 && m.vanish == null && !m.atk) m.vanish = 0.8;
      if (m.vanish != null) {
        m.vanish -= dt; m.fade = Math.max(0, m.vanish / 0.8); vx = vy = 0;
        if (m.vanish <= 0) {

  else if (k === 'tear') { ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.quadraticCurveTo(x + 7, y + 2, x, y + 6); ctx.quadraticCurveTo(x - 7, y + 2, x, y - 8); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y, 1.5, 3); }
  else { ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + 6, y); ctx.lineTo(x, y + 7); ctx.lineTo(x - 6, y); ctx.fill(); }
}
function drawHUD() {

  if (weak) { ctx.fillStyle = '#b197fc'; ctx.font = `12px ${FONT}`; ctx.fillText('영력 부족 · 귀신에게 피해가 거의 안 들어감', 20, 68); }
  // 포인트
  ctx.textAlign = 'right'; ctx.font = `bold 14px ${FONT}`;
  let yy = 26;
  for (const k of ['soul', 'tear', 'grudge']) {
    ctx.fillStyle = PT_COLORS[k]; ctx.fillText(`${PT_NAMES[k]} ${pts[k]}`, W - 20, yy);
    ptIcon(k, W - 32 - ctx.measureText(`${PT_NAMES[k]} ${pts[k]}`).width, yy - 5);
    yy += 20;
  }
  ctx.font = `12px ${FONT}`; ctx.fillStyle = '#ffd43b';
  for (const u in uniques) { ctx.fillText(`★ ${UNIQUES[u].name}`, W - 20, yy); yy += 16; }
  // 거리

  // 강한 몬스터 체력

    ctx.fillStyle = owned[id] ? '#eee' : '#555';
    ctx.fillText(`${i + 1} ${owned[id] ? WEAPONS[id].name + (wlv[id] ? ' +' + wlv[id] : '') : '???'}`, x + 7, y + 19);
  });
  // 스킬 칸

    ctx.strokeStyle = '#555'; ctx.strokeRect(x + 0.5, y + 0.5, 138, 30);

}
function drawMsgs() {
  ctx.textAlign = 'center';
  msgs.forEach((m, i) => {

   '영력이 부족하면 귀신에게 피해가 거의 안 들어간다 (좀비·해골은 상관없음)'].forEach((s, i) => ctx.fillText(s, W / 2, 300 + i * 24));
  ctx.font = `bold 18px ${FONT}`; ctx.fillStyle = `rgba(255,220,150,${0.6 + 0.4 * Math.sin(time * 3)})`;

function drawDead() {

  ctx.textAlign = 'center';
  ctx.font = `bold 40px ${FONT}`; ctx.fillStyle = '#d6334a'; ctx.fillText('혼이 흩어졌다…', W / 2, 230);

// ===== 사후세계 그리기 =====
function drawNpc(id, near) {
  // (0,0) 이 발 위치, 1.3배 크기로 그림
  if (id === 'reaper') {
    ctx.fillStyle = '#050507'; ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.lineTo(11, -48); ctx.lineTo(-11, -48); ctx.fill();
    ctx.fillStyle = '#d7dde0'; ctx.beginPath(); ctx.arc(0, -56, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#050507'; ctx.beginPath(); ctx.ellipse(0, -62, 21, 4.5, 0, 0, 7); ctx.fill(); ctx.fillRect(-7, -77, 14, 15);
    ctx.fillStyle = '#300'; ctx.fillRect(-4, -57, 2, 2); ctx.fillRect(2, -57, 2, 2);
    // 명부 (두루마리)
    ctx.fillStyle = '#d8c9a3'; ctx.fillRect(14, -34, 6, 18); ctx.fillStyle = '#5a3d1e'; ctx.fillRect(13, -36, 8, 3); ctx.fillRect(13, -17, 8, 3);
  } else if (id === 'lib') {
    ctx.globalAlpha = 0.75 + 0.15 * Math.sin(time * 2);
    ctx.fillStyle = '#9ccfc8'; ctx.beginPath(); ctx.moveTo(-14, -4); ctx.lineTo(14, -4); ctx.lineTo(8, -46); ctx.lineTo(-8, -46); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -54, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#2b4a47'; ctx.fillRect(-9, -61, 18, 4);
    ctx.globalAlpha = 1;
    ['#6b3a3a', '#3a4a6b', '#4f6b3a', '#6b5a3a'].forEach((c, k) => { ctx.fillStyle = c; ctx.fillRect(18, -8 - k * 7, 22, 6); });
    // 공중에 떠 있는 책장
    ctx.fillStyle = '#1d2f30'; ctx.fillRect(-60, -110, 120, 46);
    for (let k = 0; k < 9; k++) { ctx.fillStyle = ['#6b3a3a', '#3a4a6b', '#4f6b3a', '#6b5a3a'][k % 4]; ctx.fillRect(-55 + k * 12, -106 + (k % 3) * 2, 9, 18 - (k % 3) * 2); ctx.fillRect(-55 + k * 12, -84, 9, 16); }
  } else {
    ctx.fillStyle = '#25343a'; ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(24, 0); ctx.lineTo(18, -54); ctx.lineTo(-18, -54); ctx.fill();
    ctx.fillStyle = '#4f6f72'; ctx.beginPath(); ctx.arc(0, -64, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff9f43'; ctx.fillRect(-6, -66, 4, 3); ctx.fillRect(2, -66, 4, 3);
    // 망치 든 팔 (가끔 내리침)
    const hm = Math.sin(time * 3) > 0.7 ? 0.9 : -0.4;
    ctx.save(); ctx.translate(16, -44); ctx.rotate(hm);
    ctx.fillStyle = '#25343a'; ctx.fillRect(0, -3, 20, 7); ctx.fillStyle = '#3d2b1f'; ctx.fillRect(18, -2, 4, 22); ctx.fillStyle = '#666'; ctx.fillRect(13, 18, 14, 8);
    ctx.restore();
    ctx.fillStyle = '#1b1f22'; ctx.fillRect(26, -18, 34, 10); ctx.fillRect(36, -8, 14, 8);
    const fg = ctx.createRadialGradient(43, -20, 0, 43, -20, 22); fg.addColorStop(0, `rgba(255,140,60,${0.5 + 0.2 * Math.sin(time * 7)})`); fg.addColorStop(1, 'rgba(255,140,60,0)');
    ctx.fillStyle = fg; ctx.fillRect(21, -42, 44, 44);
  }
}
function drawAfterlife() {
  glows = []; lights = [];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#061517'); g.addColorStop(0.5, '#0e2a2c'); g.addColorStop(1, '#081a1b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 떠다니는 등불 (멀리)
  for (let i = 0; i < 24; i++) {
    const x = hash(i, 70) * (AW + 200) - acam * 0.4 - 100, y = 30 + hash(i, 71) * 90 + Math.sin(time + i) * 6;
    const lg = ctx.createRadialGradient(x, y, 0, x, y, 16); lg.addColorStop(0, 'rgba(160,255,235,0.6)'); lg.addColorStop(1, 'rgba(160,255,235,0)');
    ctx.fillStyle = lg; ctx.fillRect(x - 16, y - 16, 32, 32);
  }
  // 강 건너편 기와 지붕들
  ctx.fillStyle = '#0a1f22';
  for (let i = 0; i < 8; i++) {
    const x = i * 260 + 60 - acam * 0.55, w = 90 + hash(i, 80) * 60, h = 30 + hash(i, 81) * 25;
    ctx.fillRect(x - w / 2 + 10, 150 - h, w - 20, h);
    ctx.beginPath(); ctx.moveTo(x - w / 2 - 8, 150 - h); ctx.quadraticCurveTo(x, 150 - h - 26, x + w / 2 + 8, 150 - h); ctx.fill();
  }
  // 영혼의 강
  ctx.fillStyle = '#0b3a3d'; ctx.fillRect(0, 150, W, 50);
  for (let i = 0; i < 60; i++) {
    const x = ((hash(i, 60) * (AW + 300) + time * (20 + hash(i, 61) * 30) - acam * 0.8) % (AW + 300) + AW + 300) % (AW + 300) - 150, y = 155 + hash(i, 62) * 40;
    ctx.fillStyle = `rgba(180,255,240,${0.3 + 0.3 * Math.sin(time * 2 + i)})`; ctx.beginPath(); ctx.arc(x, y, 1.5 + hash(i, 63) * 2, 0, 7); ctx.fill();
  }
  // 나루터 땅
  const gg = ctx.createLinearGradient(0, 200, 0, H);
  gg.addColorStop(0, '#0d2a2c'); gg.addColorStop(1, '#071718');
  ctx.fillStyle = gg; ctx.fillRect(0, 200, W, H - 200);
  ctx.fillStyle = '#123536'; ctx.fillRect(0, 200, W, 6);
  // 바닥의 돌 등불
  for (let i = 0; i < 9; i++) {
    const x = 170 + i * 170 - acam, y = 262;
    if (x < -40 || x > W + 40) continue;
    ctx.fillStyle = '#29393b'; ctx.fillRect(x - 5, y - 30, 10, 30); ctx.fillRect(x - 12, y - 42, 24, 12); ctx.fillRect(x - 15, y - 46, 30, 5);
    const lg = ctx.createRadialGradient(x, y - 36, 0, x, y - 36, 26); lg.addColorStop(0, 'rgba(160,255,235,0.55)'); lg.addColorStop(1, 'rgba(160,255,235,0)');
    ctx.fillStyle = lg; ctx.fillRect(x - 26, y - 62, 52, 52);
  }
  // 이승으로 가는 문
  {
    const x = PORTAL.x - acam, y = PORTAL.y;
    for (let k = 3; k >= 0; k--) {
      const pg = ctx.createRadialGradient(x, y - 50, 0, x, y - 50, 60 - k * 8);
      pg.addColorStop(0, `rgba(255,190,120,${0.25 + 0.1 * Math.sin(time * 3 + k)})`); pg.addColorStop(1, 'rgba(255,150,80,0)');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.ellipse(x, y - 50, 30 - k * 3, 58 - k * 6, 0, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,200,140,0.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, y - 50, 30, 58, 0, 0, 7); ctx.stroke();
    ctx.textAlign = 'center'; ctx.font = `12px ${FONT}`; ctx.fillStyle = '#ffcf9a'; ctx.fillText('이승으로', x, y - 116);
  }
  // NPC 와 나를 앞뒤 순서대로
  const near = talking ? null : nearAfter();
  const list = NPCS.map(n => ({ y: n.y, f: () => {
    const x = n.x - acam, on = near === n.id || talking === n.id;
    shadow(x, n.y, 22);
    if (on) { const hg = ctx.createRadialGradient(x, n.y - 40, 0, x, n.y - 40, 90); hg.addColorStop(0, 'rgba(120,255,230,0.22)'); hg.addColorStop(1, 'rgba(120,255,230,0)'); ctx.fillStyle = hg; ctx.fillRect(x - 90, n.y - 130, 180, 180); }
    ctx.save(); ctx.translate(x, n.y); ctx.scale(1.3, 1.3); drawNpc(n.id); ctx.restore();
    ctx.textAlign = 'center'; ctx.font = `${on ? 'bold ' : ''}13px ${FONT}`; ctx.fillStyle = on ? '#bff' : '#7aa';
    ctx.fillText(`${n.name} · ${n.job}`, x, n.y - (n.id === 'lib' ? 160 : 112));
  } }));
  list.push({ y: AP.y, f: () => drawPlayer(AP.x - acam, AP.y) });
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  // 안내
  if (near && !talking) {
    const t = near === 'portal' ? PORTAL : NPCS.find(n => n.id === near);
    ctx.textAlign = 'center'; ctx.font = `bold 15px ${FONT}`;
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(time * 4); ctx.fillStyle = near === 'portal' ? '#ffcf9a' : '#9ef0e4';
    ctx.fillText(near === 'portal' ? '[F] 이승으로 돌아가기' : '[F] 말 걸기', t.x - acam, t.y + 26); ctx.globalAlpha = 1;
  }
  // 포인트와 조작 안내
  ctx.textAlign = 'right'; ctx.font = `bold 14px ${FONT}`;
  let yy = 26;
  for (const k of ['soul', 'tear', 'grudge']) { ctx.fillStyle = PT_COLORS[k]; ctx.fillText(`${PT_NAMES[k]} ${pts[k]}`, W - 20, yy); yy += 20; }
  ctx.textAlign = 'left'; ctx.font = `12px ${FONT}`; ctx.fillStyle = '#7fbfb6';
  ctx.fillText('WASD 이동 · NPC 앞에서 F 말 걸기 · 왼쪽 끝 문으로 이승에 돌아감', 20, 26);
  drawMsgs();
}

// ===== 반복 =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  if (state === 'afterlife') { updateAfterlife(dt); drawAfterlife(); }
  else {
    drawWorld();
    if (state === 'play' || state === 'dead') drawHUD();
    if (state === 'title') drawTitle();
    if (state === 'dead') drawDead();
    drawMsgs();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
