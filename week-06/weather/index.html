<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <meta name="description" content="오늘 날씨를 받아 와 보여 주는 앱">
  <title>오늘 날씨</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>오늘 날씨</h1>
    <select id="place" aria-label="지역 고르기"></select>
  </header>

  <main>
    <!-- 정보를 못 받아 왔을 때 까닭을 보여 주는 칸 -->
    <section id="problem" class="problem" hidden>
      <p class="problem-title">⚠️ <span id="problem-title"></span></p>
      <p id="problem-why" class="problem-why"></p>
      <button id="retry" type="button">다시 받아 오기</button>
    </section>

    <p id="loading" class="loading">날씨를 받아 오는 중…</p>

    <section id="now" class="card now" hidden>
      <div class="now-icon" id="now-icon"></div>
      <div>
        <div class="now-temp"><span id="now-temp"></span>°</div>
        <div class="now-desc" id="now-desc"></div>
        <div class="now-feel">체감 <span id="now-feel"></span>°</div>
      </div>
    </section>

    <section id="today" class="card today" hidden>
      <div><span class="label">최고</span><b id="t-max"></b></div>
      <div><span class="label">최저</span><b id="t-min"></b></div>
      <div><span class="label">비 올 확률</span><b id="t-rain"></b></div>
      <div><span class="label">습도</span><b id="t-hum"></b></div>
      <div><span class="label">바람</span><b id="t-wind"></b></div>
      <div><span class="label">해 뜸 · 짐</span><b id="t-sun"></b></div>
    </section>

    <section id="hours-card" class="card" hidden>
      <h2>앞으로 12시간</h2>
      <ol id="hours" class="hours"></ol>
    </section>

    <p id="updated" class="updated"></p>
  </main>

  <footer>날씨 정보: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>

  <script src="app.js"></script>
</body>
</html>
