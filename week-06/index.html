<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <title>우리 동네 날씨</title>
  <style>
    :root {
      --bg: #e8f1fb;
      --card: #ffffff;
      --text: #1a2433;
      --muted: #5b6b80;
      --accent: #2b6cb0;
      --warn-bg: #fff4e0;
      --warn-line: #e8a33a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101826;
        --card: #1b2638;
        --text: #e8eef7;
        --muted: #9aabc2;
        --accent: #7fb3ec;
        --warn-bg: #3a2b12;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 화면 폭에 맞춰 바깥 여백이 늘고 줄어요 */
      padding: max(16px, env(safe-area-inset-top)) clamp(16px, 4vw, 40px) max(16px, env(safe-area-inset-bottom));
      overflow-wrap: anywhere;
    }
    main { width: 100%; max-width: 560px; }
    h1 {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      margin: 8px 0 16px;
      text-align: center;
    }
    .card {
      background: var(--card);
      border-radius: clamp(16px, 4vw, 24px);
      padding: clamp(20px, 6vw, 40px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
      text-align: center;
    }

    /* 지금 날씨: 크게 */
    .icon { font-size: clamp(4rem, 22vw, 8rem); line-height: 1; }
    .temp {
      font-size: clamp(4rem, 24vw, 9rem);
      font-weight: 800;
      line-height: 1;
      margin-top: 8px;
      letter-spacing: -0.04em;
    }
    .word { font-size: clamp(1.6rem, 8vw, 2.6rem); font-weight: 700; margin-top: 6px; }

    /* 오늘 가장 높은·낮은 기온: 작게 */
    .range {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      margin-top: 18px;
      font-size: clamp(0.95rem, 3.6vw, 1.1rem);
      color: var(--muted);
    }
    .range b { color: var(--text); }
    .hi b { color: #d9480f; }
    .lo b { color: #1c7ed6; }
    @media (prefers-color-scheme: dark) {
      .hi b { color: #ff8a5c; }
      .lo b { color: #74b9ff; }
    }

    .updated { margin-top: 14px; font-size: 0.85rem; color: var(--muted); }

    /* 불러오는 중 */
    .loading { padding: clamp(40px, 12vw, 80px) 0; color: var(--muted); font-size: 1.1rem; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 5px solid rgba(43, 108, 176, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

    /* 못 받아 왔을 때 */
    .problem {
      background: var(--warn-bg);
      border-left: 6px solid var(--warn-line);
      text-align: left;
    }
    .problem-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 8px; }
    .problem-why { margin: 0 0 16px; line-height: 1.6; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }

    footer { margin-top: auto; padding-top: 20px; font-size: 0.8rem; color: var(--muted); text-align: center; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>📍 평택 지금 날씨</h1>

    <!-- 불러오는 동안 -->
    <section id="loading" class="card loading" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      날씨를 불러오는 중이에요…
    </section>

    <!-- 못 받아 왔을 때 -->
    <section id="problem" class="card problem" role="alert" hidden>
      <p class="problem-title">⚠️ <span id="problem-title"></span></p>
      <p class="problem-why" id="problem-why"></p>
      <button id="retry" type="button">다시 불러오기</button>
    </section>

    <!-- 받아 왔을 때 -->
    <section id="weather" class="card" hidden>
      <div class="icon" id="icon" aria-hidden="true"></div>
      <div class="temp"><span id="temp"></span>°</div>
      <div class="word" id="word"></div>
      <div class="range">
        <span class="hi">오늘 가장 높은 기온 <b id="max"></b></span>
        <span class="lo">오늘 가장 낮은 기온 <b id="min"></b></span>
      </div>
      <div class="updated" id="updated"></div>
    </section>
  </main>

  <footer>날씨 정보: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (키 없이 써요)</footer>

  <script>
    // 우리 동네: Open-Meteo 에서 찾은 평택시(경기도) 위치
    const PLACE = { name: "평택", lat: 36.99, lon: 127.09 };

    // 날씨 번호 → 한국어 낱말과 그림
    function weatherWord(code, isDay) {
      const table = {
        0: ["맑음", isDay ? "☀️" : "🌙"],
        1: ["대체로 맑음", isDay ? "🌤️" : "🌙"],
        2: ["구름 조금", isDay ? "⛅" : "☁️"],
        3: ["흐림", "☁️"],
        45: ["안개", "🌫️"], 48: ["안개", "🌫️"],
        51: ["이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["이슬비", "🌦️"],
        56: ["어는 이슬비", "🌧️"], 57: ["어는 이슬비", "🌧️"],
        61: ["비", "🌧️"], 63: ["비", "🌧️"], 65: ["많은 비", "🌧️"],
        66: ["어는 비", "🌧️"], 67: ["어는 비", "🌧️"],
        71: ["눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["많은 눈", "❄️"], 77: ["싸락눈", "🌨️"],
        80: ["소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["센 소나기", "🌧️"],
        85: ["눈보라", "🌨️"], 86: ["눈보라", "❄️"],
        95: ["천둥번개", "⛈️"], 96: ["천둥번개와 우박", "⛈️"], 99: ["천둥번개와 우박", "⛈️"],
      };
      return table[code] || ["알 수 없는 날씨", "❔"];
    }

    const $ = (id) => document.getElementById(id);

    // 못 받아 온 까닭을 담는 상자
    class Problem extends Error {
      constructor(title, why) { super(title); this.title = title; this.why = why; }
    }

    function show(which) {
      $("loading").hidden = which !== "loading";
      $("problem").hidden = which !== "problem";
      $("weather").hidden = which !== "weather";
    }

    async function getWeather() {
      if (!navigator.onLine) {
        throw new Problem("인터넷에 연결돼 있지 않아요", "와이파이나 데이터가 켜져 있는지 확인한 뒤 '다시 불러오기'를 눌러 주세요.");
      }
      const url = "https://api.open-meteo.com/v1/forecast" +
        `?latitude=${PLACE.lat}&longitude=${PLACE.lon}` +
        "&current=temperature_2m,weather_code,is_day" +
        "&daily=temperature_2m_max,temperature_2m_min" +
        "&timezone=Asia%2FSeoul&forecast_days=1";

      const stop = new AbortController();
      const timer = setTimeout(() => stop.abort(), 15000); // 15초 넘으면 그만 기다려요
      let res;
      try {
        res = await fetch(url, { signal: stop.signal });
      } catch (e) {
        if (e.name === "AbortError") {
          throw new Problem("날씨 서버가 대답하지 않아요", "15초 동안 기다렸지만 답이 없었어요. 인터넷이 느리거나 서버가 바쁠 수 있어요.");
        }
        throw new Problem("날씨 서버에 닿지 못했어요", "인터넷이 끊겼거나 서버에 연결할 수 없어요. 연결을 확인하고 다시 해 보세요.");
      } finally {
        clearTimeout(timer);
      }

      if (!res.ok) {
        const why = res.status === 429 ? "너무 자주 물어봐서 서버가 잠깐 막았어요. 조금 뒤에 다시 해 보세요."
          : res.status >= 500 ? `날씨 서버에 문제가 생겼어요 (오류 번호 ${res.status}).`
          : `서버가 요청을 받아 주지 않았어요 (오류 번호 ${res.status}).`;
        throw new Problem("날씨를 받아 오지 못했어요", why);
      }

      let data;
      try { data = await res.json(); }
      catch { throw new Problem("날씨 정보를 읽지 못했어요", "서버가 보낸 정보의 모양이 이상해요. 잠시 뒤 다시 해 보세요."); }

      const c = data.current, d = data.daily;
      if (!c || !d || typeof c.temperature_2m !== "number" || !d.temperature_2m_max) {
        throw new Problem("날씨 정보가 모자라요", "서버가 보낸 정보에 필요한 칸이 빠져 있어요. 잠시 뒤 다시 해 보세요.");
      }
      return data;
    }

    async function update() {
      show("loading");
      $("retry").disabled = true;
      try {
        const data = await getWeather();
        const c = data.current, d = data.daily;
        const [word, icon] = weatherWord(c.weather_code, c.is_day === 1);
        $("icon").textContent = icon;
        $("temp").textContent = Math.round(c.temperature_2m);
        $("word").textContent = word;
        $("max").textContent = Math.round(d.temperature_2m_max[0]) + "°";
        $("min").textContent = Math.round(d.temperature_2m_min[0]) + "°";
        const t = new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
        $("updated").textContent = `${t}에 받아 온 정보예요`;
        show("weather");
      } catch (e) {
        const p = e instanceof Problem ? e
          : new Problem("알 수 없는 문제가 생겼어요", "까닭: " + (e && e.message ? e.message : String(e)));
        $("problem-title").textContent = p.title;
        $("problem-why").textContent = p.why;
        show("problem");
      } finally {
        $("retry").disabled = false;
      }
    }

    $("retry").addEventListener("click", update);
    window.addEventListener("online", update); // 인터넷이 다시 연결되면 저절로 다시 불러와요
    update();
  </script>
</body>
</html>
