<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <title>우리 동네 날씨</title>
  <style>
    :root {
      --bg: #e8f1fb;
      --card: #ffffff;
      --soft: #f1f6fc;
      --text: #1a2433;
      --muted: #5b6b80;
      --accent: #2b6cb0;
      --warn-bg: #fff4e0;
      --warn-line: #e8a33a;
      --hi: #d9480f;
      --lo: #1c7ed6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101826;
        --card: #1b2638;
        --soft: #233149;
        --text: #e8eef7;
        --muted: #9aabc2;
        --accent: #7fb3ec;
        --warn-bg: #3a2b12;
        --hi: #ff8a5c;
        --lo: #74b9ff;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 화면 폭에 맞춰 바깥 여백이 늘고 줄어요 */
      padding: max(16px, env(safe-area-inset-top)) clamp(16px, 4vw, 40px) max(16px, env(safe-area-inset-bottom));
      overflow-wrap: anywhere;
    }
    main { width: 100%; max-width: 900px; }
    h1 {
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      margin: 8px 0 16px;
      text-align: center;
    }
    h2 { font-size: 1rem; color: var(--muted); margin: 0 0 12px; }
    .card {
      background: var(--card);
      border-radius: clamp(16px, 4vw, 24px);
      padding: clamp(18px, 5vw, 32px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    }

    /* 폰에서는 한 줄로 쌓이고, 넓은 화면에서는 두 칸으로 나란히 */
    .layout { display: grid; gap: 14px; }
    @media (min-width: 760px) {
      .layout { grid-template-columns: 1fr 1fr; align-items: start; }
      .layout .wide { grid-column: 1 / -1; }
    }

    /* 지금 날씨: 크게 */
    .now { text-align: center; }
    .icon { font-size: clamp(3.6rem, 18vw, 6.5rem); line-height: 1; }
    .temp {
      font-size: clamp(4rem, 22vw, 8rem);
      font-weight: 800;
      line-height: 1;
      margin-top: 6px;
      letter-spacing: -0.04em;
    }
    .word { font-size: clamp(1.5rem, 7vw, 2.3rem); font-weight: 700; margin-top: 6px; }
    .feel { color: var(--muted); margin-top: 4px; }

    /* 오늘 가장 높은·낮은 기온: 작게 */
    .range {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      margin-top: 14px;
      font-size: clamp(0.95rem, 3.6vw, 1.05rem);
      color: var(--muted);
    }
    .hi b { color: var(--hi); }
    .lo b { color: var(--lo); }

    .tip {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--soft);
      line-height: 1.5;
    }

    /* 자세한 정보 칸들 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }
    .item { background: var(--soft); border-radius: 14px; padding: 12px; }
    .item .label { font-size: 0.82rem; color: var(--muted); }
    .item .value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }
    .item .sub { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }

    /* 미세먼지 등급 색 */
    .g1 { color: #1c7ed6; } .g2 { color: #2f9e44; } .g3 { color: #e67700; } .g4 { color: #e03131; }
    @media (prefers-color-scheme: dark) {
      .g1 { color: #74b9ff; } .g2 { color: #69db7c; } .g3 { color: #ffc078; } .g4 { color: #ff8787; }
    }
    .air-problem { color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; line-height: 1.5; }

    /* 앞으로 6시간 */
    .hours {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      text-align: center;
    }
    .hours .h-time { font-size: 0.8rem; color: var(--muted); }
    .hours .h-icon { font-size: clamp(1.3rem, 6vw, 1.8rem); margin: 4px 0; }
    .hours .h-temp { font-weight: 700; }
    .hours .h-rain { font-size: 0.75rem; color: var(--accent); }

    .updated { margin-top: 14px; font-size: 0.85rem; color: var(--muted); text-align: center; }

    /* 불러오는 중 */
    .loading { padding: clamp(40px, 12vw, 80px) 0; color: var(--muted); font-size: 1.1rem; text-align: center; }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 16px;
      border: 5px solid rgba(43, 108, 176, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

    /* 못 받아 왔을 때 */
    .problem { background: var(--warn-bg); border-left: 6px solid var(--warn-line); }
    .problem-title { font-size: 1.15rem; font-weight: 700; margin: 0 0 8px; }
    .problem-why { margin: 0 0 16px; line-height: 1.6; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }

    footer { margin-top: auto; padding-top: 20px; font-size: 0.8rem; color: var(--muted); text-align: center; }
    footer a { color: var(--accent); }

    /* ================= 애니메이션 ================= */

    /* 카드 바깥 글씨는 하늘 색에 맞춰요 (어두운 하늘이면 흰 글씨) */
    h1 { color: var(--sky-text, var(--text)); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.15); }
    footer, footer a { color: var(--sky-text, var(--muted)); opacity: 0.9; }

    /* 움직이는 배경 하늘: 맨 뒤에 깔려요 */
    #sky {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: var(--sky-bg, var(--bg));
    }
    #sky > * { position: absolute; }

    /* 맑은 낮: 빛나는 해 */
    .sunglow {
      top: -18vmin; right: -18vmin;
      width: 70vmin; height: 70vmin;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 236, 140, 0.95), rgba(255, 200, 60, 0.35) 40%, transparent 70%);
      animation: glow 5s ease-in-out infinite alternate;
    }
    @keyframes glow { to { transform: scale(1.12); opacity: 0.85; } }

    /* 밤: 반짝이는 별, 가끔 별똥별 */
    .star {
      width: var(--s); height: var(--s);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
      animation: twinkle var(--d) ease-in-out infinite;
      animation-delay: var(--delay);
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }
    .shoot {
      top: 12vh; right: -10vw;
      width: 140px; height: 2px;
      background: linear-gradient(90deg, #fff, transparent);
      border-radius: 2px;
      opacity: 0;
      animation: shoot 9s linear infinite;
      animation-delay: 2s;
    }
    @keyframes shoot {
      0% { transform: translate(0, 0) rotate(-25deg); opacity: 0; }
      2% { opacity: 1; }
      9% { transform: translate(-55vw, 28vh) rotate(-25deg); opacity: 0; }
      100% { opacity: 0; }
    }

    /* 흘러가는 구름 */
    .cloud {
      left: 0;
      font-size: var(--s);
      opacity: var(--o);
      line-height: 1;
      animation: drift var(--d) linear infinite;
      animation-delay: var(--delay);
    }
    @keyframes drift { from { transform: translateX(-35vw); } to { transform: translateX(115vw); } }

    /* 비 */
    .drop {
      top: 0;
      width: 2px; height: var(--h);
      border-radius: 2px;
      background: linear-gradient(transparent, rgba(220, 235, 255, 0.85));
      animation: fall var(--d) linear infinite;
      animation-delay: var(--delay);
    }
    @keyframes fall { from { transform: translate(0, -25vh) rotate(8deg); } to { transform: translate(-12vh, 110vh) rotate(8deg); } }

    /* 천둥번개: 하늘이 번쩍 */
    .flash { inset: 0; background: #fff; opacity: 0; animation: flash 7s infinite; }
    @keyframes flash {
      0%, 90%, 92.5%, 95%, 100% { opacity: 0; }
      91% { opacity: 0.55; }
      94% { opacity: 0.35; }
    }

    /* 눈: 떨어지면서(바깥) 좌우로 흔들려요(안쪽) */
    .flake { top: 0; animation: snowfall var(--d) linear infinite; animation-delay: var(--delay); }
    .flake span {
      display: block;
      color: #fff;
      font-size: var(--s);
      text-shadow: 0 0 4px rgba(120, 150, 190, 0.6);
      animation: sway var(--sw) ease-in-out infinite alternate;
    }
    @keyframes snowfall { from { transform: translateY(-10vh); } to { transform: translateY(110vh); } }
    @keyframes sway { from { transform: translateX(-18px) rotate(-20deg); } to { transform: translateX(18px) rotate(20deg); } }

    /* 안개 */
    .fog {
      left: -50%;
      width: 200%; height: 35vh;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.55), transparent 65%);
      animation: fogmove var(--d) ease-in-out infinite alternate;
    }
    @keyframes fogmove { from { transform: translateX(-12%); } to { transform: translateX(12%); } }

    /* 카드를 살짝 비치게 해서 뒤의 하늘이 보이게 (흐림 처리로 글씨는 잘 읽혀요) */
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .card { background: rgba(255, 255, 255, 0.88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
      .problem { background: rgba(255, 244, 224, 0.9); }
      @media (prefers-color-scheme: dark) {
        .card { background: rgba(27, 38, 56, 0.8); }
        .problem { background: rgba(58, 43, 18, 0.9); }
      }
    }

    /* 하늘이 바뀔 때 부드럽게 나타나기 */
    #sky.fade { animation: skyfade 1.2s ease both; }
    @keyframes skyfade { from { opacity: 0; } }

    /* 카드가 차례로 톡 올라오기 */
    .pop { animation: pop 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: var(--delay, 0s); }
    @keyframes pop { from { opacity: 0; transform: translateY(22px) scale(0.97); } }

    /* 큰 날씨 그림: 둥실둥실, 해는 천천히 돌기 */
    .icon { display: inline-block; animation: float 4s ease-in-out infinite; }
    .icon.sunny { animation: float 4s ease-in-out infinite, turn 24s linear infinite; }
    @keyframes float { 50% { translate: 0 -10px; } }
    @keyframes turn { to { rotate: 360deg; } }

    /* 앞으로 6시간: 한 칸씩 차례로 */
    .hours li { animation: pop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(0.45s + var(--i) * 0.08s); }

    /* 정보 칸에 손가락(마우스)을 올리면 살짝 떠요 */
    .item { transition: transform 0.2s, box-shadow 0.2s; }
    .item:hover { transform: translateY(-3px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08); }

    /* 못 받아 왔을 때: 경고 칸이 살짝 흔들려요 */
    .problem:not([hidden]) { animation: pop 0.5s both, shake 0.5s 0.5s; }
    @keyframes shake { 25% { translate: -6px 0; } 50% { translate: 6px 0; } 75% { translate: -3px 0; } }

    /* "동작 줄이기"를 켠 사람에게는 움직임을 멈춰요 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .shoot, .flash { display: none; }
    }
  </style>
</head>
<body>
  <!-- 움직이는 배경 하늘 (날씨에 따라 별·구름·비·눈이 바뀌어요) -->
  <div id="sky" aria-hidden="true"></div>

  <main>
    <h1>📍 평택 지금 날씨</h1>

    <!-- 불러오는 동안 -->
    <section id="loading" class="card loading pop" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      날씨를 불러오는 중이에요…
    </section>

    <!-- 못 받아 왔을 때 -->
    <section id="problem" class="card problem" role="alert" hidden>
      <p class="problem-title">⚠️ <span id="problem-title"></span></p>
      <p class="problem-why" id="problem-why"></p>
      <button id="retry" type="button">다시 불러오기</button>
    </section>

    <!-- 받아 왔을 때 -->
    <div id="weather" class="layout" hidden>
      <section class="card now pop">
        <div class="icon" id="icon" aria-hidden="true"></div>
        <div class="temp"><span id="temp"></span>°</div>
        <div class="word" id="word"></div>
        <div class="feel">체감 <span id="feel"></span>°</div>
        <div class="range">
          <span class="hi">오늘 가장 높은 기온 <b id="max"></b></span>
          <span class="lo">오늘 가장 낮은 기온 <b id="min"></b></span>
        </div>
        <div class="tip" id="tip"></div>
      </section>

      <section class="card pop" style="--delay: 0.15s">
        <h2>자세히</h2>
        <div class="grid">
          <div class="item"><div class="label">☔ 비 올 확률</div><div class="value" id="rain"></div><div class="sub" id="rain-sub"></div></div>
          <div class="item"><div class="label">💧 습도</div><div class="value" id="hum"></div><div class="sub" id="hum-sub"></div></div>
          <div class="item"><div class="label">🍃 바람</div><div class="value" id="wind"></div><div class="sub" id="wind-sub"></div></div>
          <div class="item"><div class="label">🌅 해 뜸 · 해 짐</div><div class="value" id="sun"></div><div class="sub" id="sun-sub"></div></div>
          <div class="item"><div class="label">😷 미세먼지</div><div class="value" id="pm10"></div><div class="sub" id="pm10-sub"></div></div>
          <div class="item"><div class="label">😷 초미세먼지</div><div class="value" id="pm25"></div><div class="sub" id="pm25-sub"></div></div>
        </div>
        <p class="air-problem" id="air-problem" hidden></p>
      </section>

      <section class="card wide pop" style="--delay: 0.3s">
        <h2>앞으로 6시간</h2>
        <ol class="hours" id="hours"></ol>
        <div class="updated" id="updated"></div>
      </section>
    </div>
  </main>

  <footer>날씨·공기 정보: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (키 없이 써요)</footer>

  <script>
    // 우리 동네: Open-Meteo 에서 찾은 평택시(경기도) 위치
    const PLACE = { name: "평택", lat: 36.99, lon: 127.09 };

    // 날씨 번호 → 한국어 낱말과 그림
    function weatherWord(code, isDay) {
      const table = {
        0: ["맑음", isDay ? "☀️" : "🌙"],
        1: ["대체로 맑음", isDay ? "🌤️" : "🌙"],
        2: ["구름 조금", isDay ? "⛅" : "☁️"],
        3: ["흐림", "☁️"],
        45: ["안개", "🌫️"], 48: ["안개", "🌫️"],
        51: ["이슬비", "🌦️"], 53: ["이슬비", "🌦️"], 55: ["이슬비", "🌦️"],
        56: ["어는 이슬비", "🌧️"], 57: ["어는 이슬비", "🌧️"],
        61: ["비", "🌧️"], 63: ["비", "🌧️"], 65: ["많은 비", "🌧️"],
        66: ["어는 비", "🌧️"], 67: ["어는 비", "🌧️"],
        71: ["눈", "🌨️"], 73: ["눈", "🌨️"], 75: ["많은 눈", "❄️"], 77: ["싸락눈", "🌨️"],
        80: ["소나기", "🌦️"], 81: ["소나기", "🌧️"], 82: ["센 소나기", "🌧️"],
        85: ["눈보라", "🌨️"], 86: ["눈보라", "❄️"],
        95: ["천둥번개", "⛈️"], 96: ["천둥번개와 우박", "⛈️"], 99: ["천둥번개와 우박", "⛈️"],
      };
      return table[code] || ["알 수 없는 날씨", "❔"];
    }

    // 미세먼지 등급 (우리나라 기준)
    function dustGrade(value, cuts) {
      const names = ["좋음", "보통", "나쁨", "매우 나쁨"];
      let i = cuts.findIndex((c) => value <= c);
      if (i < 0) i = 3;
      return { name: names[i], cls: "g" + (i + 1) };
    }

    // 바람 세기를 말로
    function windWord(ms) {
      if (ms < 1) return "거의 없음";
      if (ms < 4) return "약한 바람";
      if (ms < 9) return "조금 센 바람";
      if (ms < 14) return "센 바람";
      return "아주 센 바람";
    }

    // 한 줄 도움말: 기온과 비를 보고 정해요
    function makeTip(feel, rainChance, code) {
      const tips = [];
      if (code >= 71 && code <= 86 && !(code >= 80 && code <= 82)) tips.push("눈이 와요. 미끄러우니 천천히 걸어요 ⛄");
      else if (rainChance >= 60) tips.push("비 올 확률이 높아요. 우산을 꼭 챙기세요 ☔");
      else if (rainChance >= 30) tips.push("비가 올 수도 있어요. 작은 우산이 있으면 좋아요 🌂");
      if (feel <= -5) tips.push("아주 추워요. 두꺼운 패딩과 장갑을 챙기세요 🧤");
      else if (feel <= 5) tips.push("추워요. 따뜻한 외투를 입으세요 🧥");
      else if (feel <= 12) tips.push("쌀쌀해요. 겉옷을 하나 챙기세요");
      else if (feel <= 22) tips.push("다니기 좋은 날씨예요 🙂");
      else if (feel <= 28) tips.push("조금 더워요. 가볍게 입으세요");
      else tips.push("더워요. 물을 자주 마시세요 💧");
      return tips.join(" ");
    }

    const $ = (id) => document.getElementById(id);
    const hhmm = (iso) => iso.slice(11, 16);

    // ================= 움직이는 배경 하늘 =================
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const rand = (a, b) => a + Math.random() * (b - a);

    // 날씨 번호 → 하늘 종류
    function skyType(code) {
      if (code >= 95) return "thunder";
      if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "rain";
      if (code === 45 || code === 48) return "fog";
      if (code === 2 || code === 3) return "clouds";
      return "clear";
    }

    // 하늘 종류마다 배경 색 [위, 아래]과 카드 바깥 글씨 색
    const SKY_COLORS = {
      clear:   { day: ["#5aa9ef", "#cbe6fb", "#13233a"], night: ["#070d24", "#25356b", "#f0f4ff"] },
      clouds:  { day: ["#8fa6bd", "#dbe4ee", "#13233a"], night: ["#151c2e", "#3a4560", "#f0f4ff"] },
      rain:    { day: ["#56677b", "#9eadbd", "#ffffff"], night: ["#10151f", "#33404f", "#f0f4ff"] },
      thunder: { day: ["#2c3240", "#5d6676", "#ffffff"], night: ["#0a0c12", "#2a303c", "#f0f4ff"] },
      snow:    { day: ["#a9bed3", "#f1f5f9", "#13233a"], night: ["#1b2436", "#4a5872", "#f0f4ff"] },
      fog:     { day: ["#aeb6bf", "#e3e6ea", "#13233a"], night: ["#222831", "#4a525d", "#f0f4ff"] },
    };

    function buildSky(type, isDay) {
      const sky = $("sky");
      const [top, bottom, text] = SKY_COLORS[type][isDay ? "day" : "night"];
      document.body.style.setProperty("--sky-bg", `linear-gradient(${top}, ${bottom})`);
      document.body.style.setProperty("--sky-text", text);
      sky.style.setProperty("--sky-bg", `linear-gradient(${top}, ${bottom})`);
      sky.innerHTML = "";

      const add = (cls, vars, html = "") => {
        const el = document.createElement("div");
        el.className = cls;
        for (const k in vars) el.style.setProperty(k, vars[k]);
        el.innerHTML = html;
        sky.appendChild(el);
        return el;
      };
      const wide = Math.min(window.innerWidth, 1600) / 1000; // 화면이 넓으면 조금 더 많이

      // 별: 맑은 밤에 많이, 구름 낀 밤에는 조금
      if (!isDay && (type === "clear" || type === "clouds")) {
        const n = Math.round((type === "clear" ? 90 : 25) * Math.max(wide, 0.5));
        for (let i = 0; i < n; i++) {
          add("star", {
            left: rand(0, 100) + "%", top: rand(0, 75) + "%",
            "--s": rand(1, 3).toFixed(1) + "px", "--d": rand(2, 5).toFixed(1) + "s", "--delay": -rand(0, 5).toFixed(1) + "s",
          });
        }
        if (type === "clear" && !reduceMotion) add("shoot", {});
      }

      // 해: 맑은 낮
      if (isDay && type === "clear") add("sunglow", {});

      // 구름
      const cloudCount = { clear: 3, clouds: 8, rain: 5, thunder: 5, snow: 4, fog: 2 }[type];
      const cloudChar = type === "rain" || type === "thunder" ? "🌧️" : "☁️";
      for (let i = 0; i < cloudCount; i++) {
        const dur = rand(45, 110);
        add("cloud", {
          top: rand(-3, 55) + "%",
          "--s": rand(50, 130).toFixed(0) + "px",
          "--o": (type === "clear" ? rand(0.35, 0.6) : rand(0.5, 0.85)).toFixed(2),
          "--d": dur.toFixed(0) + "s",
          "--delay": -rand(0, dur).toFixed(0) + "s", // 처음부터 여기저기 흩어져 있게
        }, cloudChar);
      }

      // 비
      if (type === "rain" || type === "thunder") {
        const n = Math.round(110 * Math.max(wide, 0.45));
        for (let i = 0; i < n; i++) {
          add("drop", {
            left: rand(0, 110) + "%",
            "--h": rand(14, 26).toFixed(0) + "px", "--d": rand(0.6, 1.1).toFixed(2) + "s", "--delay": -rand(0, 1.1).toFixed(2) + "s",
          });
        }
      }
      if (type === "thunder" && !reduceMotion) add("flash", {});

      // 눈
      if (type === "snow") {
        const n = Math.round(70 * Math.max(wide, 0.5));
        for (let i = 0; i < n; i++) {
          add("flake", {
            left: rand(0, 100) + "%",
            "--d": rand(7, 14).toFixed(1) + "s", "--delay": -rand(0, 14).toFixed(1) + "s",
          }, `<span style="--s:${rand(10, 22).toFixed(0)}px; --sw:${rand(2, 4).toFixed(1)}s">❄</span>`);
        }
      }

      // 안개
      if (type === "fog") {
        for (let i = 0; i < 4; i++) add("fog", { top: (i * 22 + rand(0, 8)) + "%", "--d": rand(14, 26).toFixed(0) + "s" });
      }

      sky.classList.remove("fade");
      void sky.offsetWidth; // 부드럽게 나타나기를 다시 시작
      sky.classList.add("fade");
    }

    // 숫자가 0 에서부터 올라가며 바뀌어요
    function countTo(el, target) {
      if (reduceMotion) { el.textContent = target; return; }
      const startTime = performance.now(), ms = 900;
      const step = (now) => {
        const t = Math.min(1, (now - startTime) / ms);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(target * eased);
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    // 시험용: 주소 끝에 ?sky=rain 처럼 붙이면 그 하늘을 미리 볼 수 있어요
    // (clear, clouds, rain, thunder, snow, fog / 밤은 &time=night)
    const params = new URLSearchParams(location.search);
    const testSky = SKY_COLORS[params.get("sky")] ? params.get("sky") : null;
    const testTime = params.get("time"); // "day" 또는 "night"

    // 날씨를 받아 오기 전에는 지금 시각으로 낮·밤만 정해서 맑은 하늘을 보여 줘요
    {
      const hour = new Date().getHours();
      const isDay = testTime ? testTime !== "night" : hour >= 7 && hour < 18;
      buildSky(testSky || "clear", isDay);
    }

    // 못 받아 온 까닭을 담는 상자
    class Problem extends Error {
      constructor(title, why) { super(title); this.title = title; this.why = why; }
    }

    function show(which) {
      $("loading").hidden = which !== "loading";
      $("problem").hidden = which !== "problem";
      $("weather").hidden = which !== "weather";
    }

    // 주소에서 정보를 받아 오고, 안 되면 까닭을 담아 알려 줘요
    async function getJSON(url, what) {
      if (!navigator.onLine) {
        throw new Problem("인터넷에 연결돼 있지 않아요", "와이파이나 데이터가 켜져 있는지 확인한 뒤 '다시 불러오기'를 눌러 주세요.");
      }
      const stop = new AbortController();
      const timer = setTimeout(() => stop.abort(), 15000); // 15초 넘으면 그만 기다려요
      let res;
      try {
        res = await fetch(url, { signal: stop.signal });
      } catch (e) {
        if (e.name === "AbortError") {
          throw new Problem(`${what} 서버가 대답하지 않아요`, "15초 동안 기다렸지만 답이 없었어요. 인터넷이 느리거나 서버가 바쁠 수 있어요.");
        }
        throw new Problem(`${what} 서버에 닿지 못했어요`, "인터넷이 끊겼거나 서버에 연결할 수 없어요. 연결을 확인하고 다시 해 보세요.");
      } finally {
        clearTimeout(timer);
      }
      if (!res.ok) {
        const why = res.status === 429 ? "너무 자주 물어봐서 서버가 잠깐 막았어요. 조금 뒤에 다시 해 보세요."
          : res.status >= 500 ? `${what} 서버에 문제가 생겼어요 (오류 번호 ${res.status}).`
          : `서버가 요청을 받아 주지 않았어요 (오류 번호 ${res.status}).`;
        throw new Problem(`${what} 정보를 받아 오지 못했어요`, why);
      }
      try { return await res.json(); }
      catch { throw new Problem(`${what} 정보를 읽지 못했어요`, "서버가 보낸 정보의 모양이 이상해요. 잠시 뒤 다시 해 보세요."); }
    }

    function getWeather() {
      return getJSON("https://api.open-meteo.com/v1/forecast" +
        `?latitude=${PLACE.lat}&longitude=${PLACE.lon}` +
        "&current=temperature_2m,apparent_temperature,weather_code,is_day,relative_humidity_2m,wind_speed_10m" +
        "&hourly=temperature_2m,weather_code,precipitation_probability,is_day" +
        "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
        "&timezone=Asia%2FSeoul&forecast_days=2", "날씨");
    }

    function getAir() {
      return getJSON("https://air-quality-api.open-meteo.com/v1/air-quality" +
        `?latitude=${PLACE.lat}&longitude=${PLACE.lon}&current=pm10,pm2_5&timezone=Asia%2FSeoul`, "공기");
    }

    function drawWeather(data) {
      const c = data.current, d = data.daily, h = data.hourly;
      if (!c || !d || !h || typeof c.temperature_2m !== "number" || !d.temperature_2m_max) {
        throw new Problem("날씨 정보가 모자라요", "서버가 보낸 정보에 필요한 칸이 빠져 있어요. 잠시 뒤 다시 해 보세요.");
      }
      const [word, icon] = weatherWord(c.weather_code, c.is_day === 1);

      // 지금 시각이 시간별 목록에서 몇 번째인지
      let start = h.time.findIndex((t) => t.slice(0, 13) === c.time.slice(0, 13));
      if (start < 0) start = 0;

      // 비 올 확률: 이미 지난 시간은 빼고, 지금부터 12시간 중 가장 높은 값
      const nextRain = h.precipitation_probability.slice(start, start + 12).filter((v) => typeof v === "number");
      const rainChance = nextRain.length ? Math.max(...nextRain) : (d.precipitation_probability_max[0] ?? 0);

      $("icon").textContent = icon;
      $("icon").classList.toggle("sunny", icon === "☀️");
      countTo($("temp"), Math.round(c.temperature_2m));

      // 배경 하늘을 지금 날씨에 맞춰요
      const isDay = testTime ? testTime !== "night" : c.is_day === 1;
      buildSky(testSky || skyType(c.weather_code), isDay);
      $("word").textContent = word;
      $("feel").textContent = Math.round(c.apparent_temperature);
      $("max").textContent = Math.round(d.temperature_2m_max[0]) + "°";
      $("min").textContent = Math.round(d.temperature_2m_min[0]) + "°";
      $("tip").textContent = makeTip(c.apparent_temperature, rainChance, c.weather_code);

      $("rain").textContent = rainChance + "%";
      $("rain-sub").textContent = "앞으로 12시간 중 가장 높을 때";
      $("hum").textContent = c.relative_humidity_2m + "%";
      $("hum-sub").textContent = c.relative_humidity_2m < 30 ? "건조해요" : c.relative_humidity_2m > 80 ? "눅눅해요" : "알맞아요";
      const ms = c.wind_speed_10m / 3.6; // km/h → m/s
      $("wind").textContent = ms.toFixed(1) + "m/s";
      $("wind-sub").textContent = windWord(ms);
      $("sun").textContent = `${hhmm(d.sunrise[0])} · ${hhmm(d.sunset[0])}`;
      const nowText = c.time.slice(11, 16);
      $("sun-sub").textContent = nowText < hhmm(d.sunrise[0]) ? "아직 해 뜨기 전" : nowText < hhmm(d.sunset[0]) ? "지금은 낮" : "해가 졌어요";

      // 지금 시각부터 6시간
      const list = $("hours");
      list.innerHTML = "";
      for (let i = start; i < Math.min(start + 6, h.time.length); i++) {
        const [, hIcon] = weatherWord(h.weather_code[i], h.is_day[i] === 1);
        const li = document.createElement("li");
        li.style.setProperty("--i", i - start); // 한 칸씩 차례로 나타나게
        li.innerHTML =
          `<div class="h-time">${i === start ? "지금" : Number(h.time[i].slice(11, 13)) + "시"}</div>` +
          `<div class="h-icon">${hIcon}</div>` +
          `<div class="h-temp">${Math.round(h.temperature_2m[i])}°</div>` +
          `<div class="h-rain">💧${h.precipitation_probability[i] ?? "-"}%</div>`;
        list.appendChild(li);
      }
    }

    function drawAir(result) {
      const ok = result.status === "fulfilled" && result.value.current && typeof result.value.current.pm10 === "number";
      for (const id of ["pm10", "pm25"]) $(id).parentElement.hidden = !ok;
      if (!ok) {
        // 공기 정보만 못 받아 와도 빈칸 대신 까닭을 알려 줘요
        const p = result.reason instanceof Problem ? result.reason : new Problem("공기 정보가 모자라요", "서버가 보낸 정보에 미세먼지 칸이 없어요.");
        $("air-problem").textContent = `😷 미세먼지: ${p.title}. ${p.why}`;
        $("air-problem").hidden = false;
        return;
      }
      $("air-problem").hidden = true;
      const a = result.value.current;
      const g10 = dustGrade(a.pm10, [30, 80, 150]);
      const g25 = dustGrade(a.pm2_5, [15, 35, 75]);
      $("pm10").textContent = g10.name;
      $("pm10").className = "value " + g10.cls;
      $("pm10-sub").textContent = Math.round(a.pm10) + "㎍/㎥";
      $("pm25").textContent = g25.name;
      $("pm25").className = "value " + g25.cls;
      $("pm25-sub").textContent = Math.round(a.pm2_5) + "㎍/㎥";
    }

    async function update() {
      show("loading");
      $("retry").disabled = true;
      try {
        // 날씨와 공기를 한꺼번에 물어봐요. 공기만 실패하면 날씨는 그대로 보여 줘요.
        const [weather, air] = await Promise.allSettled([getWeather(), getAir()]);
        if (weather.status === "rejected") throw weather.reason;
        drawWeather(weather.value);
        drawAir(air);
        const t = new Date().toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
        $("updated").textContent = `${t}에 받아 온 정보예요`;
        show("weather");
      } catch (e) {
        const p = e instanceof Problem ? e
          : new Problem("알 수 없는 문제가 생겼어요", "까닭: " + (e && e.message ? e.message : String(e)));
        $("problem-title").textContent = p.title;
        $("problem-why").textContent = p.why;
        show("problem");
      } finally {
        $("retry").disabled = false;
      }
    }

    $("retry").addEventListener("click", update);
    window.addEventListener("online", update); // 인터넷이 다시 연결되면 저절로 다시 불러와요
    update();
  </script>
</body>
</html>
